<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Speedster — Vector Animation Studio (R1)</title>
<style>
:root {
  --bg-0: #14161a;
  --bg-1: #1c1f26;
  --bg-2: #252932;
  --bg-3: #2f3440;
  --border: #383e4c;
  --text-0: #edf1f7;
  --text-1: #a9b2c3;
  --text-2: #768096;
  --accent: #4f8cff;
  --accent-dim: #2b4e92;
  --warn: #e6a23c;
  --danger: #e05a5a;
  --ok: #4ec98b;
  --tween-motion: #5b8af0;
  --tween-shape: #4ec98b;
  --onion-prev: #3fa9f5;
  --onion-next: #53d769;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-0); color: var(--text-0);
  font-family: var(--font-ui); font-size: 12px;
  user-select: none; -webkit-user-select: none;
}

#app {
  display: grid;
  grid-template-rows: 38px 1fr 220px 24px;
  grid-template-columns: 52px 1fr 276px;
  width: 100vw; height: 100vh;
}

/* Top Bar */
#topbar {
  grid-column: 1 / 4; grid-row: 1;
  background: var(--bg-1); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 0 10px;
  overflow-x: auto;
}
.brand { font-weight: 700; letter-spacing: 0.08em; color: var(--accent); font-size: 13px; margin-right: 4px; }
.breadcrumb { display: flex; align-items: center; gap: 4px; color: var(--text-1); font-size: 12px; }
.breadcrumb button { background: var(--bg-2); border: 1px solid var(--border); color: var(--text-0); padding: 2px 7px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.breadcrumb button:hover { background: var(--bg-3); }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
.spacer { flex: 1; }

button.btn, select.inp, input.inp {
  background: var(--bg-2); color: var(--text-0); border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-family: inherit;
}
button.btn:hover { background: var(--bg-3); }
button.btn.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
button.btn.danger { border-color: var(--danger); color: #ffb3b3; }
input.inp { cursor: text; padding: 3px 6px; }
input[type="color"].swatch { width: 28px; height: 22px; padding: 1px; border: 1px solid var(--border); background: var(--bg-2); border-radius: 3px; cursor: pointer; }
input[type="range"] { accent-color: var(--accent); }

/* Left Tool Rail */
#toolrail {
  grid-column: 1; grid-row: 2;
  background: var(--bg-1); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px; overflow-y: auto;
}
.tool-btn {
  width: 38px; height: 32px; background: var(--bg-2); border: 1px solid transparent;
  color: var(--text-1); border-radius: 5px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600;
  position: relative;
}
.tool-btn:hover { background: var(--bg-3); color: var(--text-0); }
.tool-btn.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }

/* Stage Viewport */
#stage-wrap {
  grid-column: 2; grid-row: 2;
  position: relative; overflow: hidden;
  background: #22262e;
  touch-action: none;
}
#stage-canvas {
  display: block; width: 100%; height: 100%;
  touch-action: none;
}
#stage-hud {
  position: absolute; top: 8px; left: 8px; pointer-events: none;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.hud-pill {
  background: rgba(20, 22, 26, 0.82); border: 1px solid var(--border);
  color: var(--text-1); padding: 2px 7px; border-radius: 10px; font-size: 11px;
  font-family: var(--font-mono);
}

/* Right Inspector / Library */
#sidebar {
  grid-column: 3; grid-row: 2;
  background: var(--bg-1); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab-btn {
  flex: 1; padding: 7px 6px; background: var(--bg-1); color: var(--text-1);
  border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 11px; font-weight: 600;
}
.tab-btn.active { color: var(--text-0); border-bottom-color: var(--accent); background: var(--bg-2); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.section {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px;
  padding: 7px; display: flex; flex-direction: column; gap: 6px;
}
.section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); font-weight: 700; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row label { font-size: 11px; color: var(--text-1); min-width: 56px; }
.row .grow { flex: 1; min-width: 40px; }

.lib-item {
  display: flex; align-items: center; gap: 6px; padding: 4px 6px;
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 4px;
  cursor: pointer; font-size: 11px;
}
.lib-item:hover { border-color: var(--accent); }
.lib-item.selected { background: var(--accent-dim); border-color: var(--accent); }
.lib-badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; background: var(--bg-3); color: var(--text-1); font-family: var(--font-mono); }

/* Timeline */
#timeline {
  grid-column: 1 / 4; grid-row: 3;
  background: var(--bg-1); border-top: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
#tl-toolbar {
  height: 30px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; padding: 0 8px; flex-shrink: 0;
  overflow-x: auto;
}
#tl-main {
  flex: 1; display: flex; overflow: hidden;
}
#tl-layers {
  width: 220px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0;
  background: var(--bg-1);
}
.tl-layer-row {
  height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 6px;
  border-bottom: 1px solid #262a33; font-size: 11px; cursor: pointer;
}
.tl-layer-row.active { background: var(--accent-dim); }
.tl-layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-mini-btn {
  width: 18px; height: 18px; background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text-1); border-radius: 3px; font-size: 9px; cursor: pointer; padding: 0;
}
.tl-mini-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

#tl-grid-wrap {
  flex: 1; overflow: auto; position: relative; background: var(--bg-0);
}
#tl-canvas {
  display: block; cursor: pointer;
}

/* Status Bar */
#statusbar {
  grid-column: 1 / 4; grid-row: 4;
  background: var(--bg-2); border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 0 10px;
  font-size: 11px; color: var(--text-1); font-family: var(--font-mono);
}
#status-msg { color: var(--text-0); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status-msg.warn { color: var(--warn); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal-card {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 8px;
  width: min(520px, 92vw); max-height: 82vh; display: flex; flex-direction: column;
  padding: 14px; gap: 10px;
}
.modal-body { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.key-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; background: var(--bg-2); border-radius: 4px; }

#ease-canvas { background: var(--bg-0); border: 1px solid var(--border); border-radius: 4px; cursor: crosshair; }
#env-canvas { background: var(--bg-0); border: 1px solid var(--border); border-radius: 4px; cursor: crosshair; }

@media (max-width: 820px) {
  #app {
    grid-template-columns: 44px 1fr 220px;
    grid-template-rows: 38px 1fr 180px 24px;
  }
  #tl-layers { width: 150px; }
}

</style>
</head>
<body>
<div id="app"></div>
<script id="speedster-core">
// 01-math.js — Deterministic integer twips, 16.16 fixed-point matrices, RGBA8,
// colour transforms, cubic-to-quadratic conversion, and canonical hashing.
// Zero non-deterministic RNG usage anywhere.

(function(root) {
  'use strict';

  const TWIPS_PER_PX = 20;
  const FIXED_ONE = 65536; // 16.16 fixed point
  const COLOR_MULT_ONE = 256; // 8.8 fixed point
  const CUBIC_TOLERANCE_TWIPS = 2; // 0.1 px tolerance

  // Deterministic PRNG (Mulberry32) — never uses non-deterministic RNG
  function createSeededRng(seed) {
    let a = (seed >>> 0) || 1;
    return function next() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pxToTwips(px) {
    return Math.round(px * TWIPS_PER_PX);
  }

  function twipsToPx(tw) {
    return tw / TWIPS_PER_PX;
  }

  function toFixed16(f) {
    return Math.round(f * FIXED_ONE);
  }

  function fromFixed16(fx) {
    return fx / FIXED_ONE;
  }

  // Exact BigInt round-to-nearest-even for rational num / den (den > 0)
  function roundRationalBigInt(num, den) {
    if (den < 0n) {
      num = -num;
      den = -den;
    }
    const neg = num < 0n;
    const absNum = neg ? -num : num;
    const q = absNum / den;
    const r = absNum % den;
    const twiceR = r * 2n;
    let res = q;
    if (twiceR > den) {
      res = q + 1n;
    } else if (twiceR === den) {
      if ((q & 1n) === 1n) res = q + 1n;
    }
    return Number(neg ? -res : res);
  }

  // 16.16 fixed-point 2D affine matrix with integer twip translation
  function identityMatrix() {
    return { a: FIXED_ONE, b: 0, c: 0, d: FIXED_ONE, tx: 0, ty: 0 };
  }

  function cloneMatrix(m) {
    return { a: m.a | 0, b: m.b | 0, c: m.c | 0, d: m.d | 0, tx: m.tx | 0, ty: m.ty | 0 };
  }

  function multiplyMatrix(m1, m2) {
    // Result = m1 * m2 (apply m2 then m1)
    const a = Number((BigInt(m1.a) * BigInt(m2.a) + BigInt(m1.c) * BigInt(m2.b)) >> 16n);
    const b = Number((BigInt(m1.b) * BigInt(m2.a) + BigInt(m1.d) * BigInt(m2.b)) >> 16n);
    const c = Number((BigInt(m1.a) * BigInt(m2.c) + BigInt(m1.c) * BigInt(m2.d)) >> 16n);
    const d = Number((BigInt(m1.b) * BigInt(m2.c) + BigInt(m1.d) * BigInt(m2.d)) >> 16n);
    const tx = m1.tx + Number((BigInt(m1.a) * BigInt(m2.tx) + BigInt(m1.c) * BigInt(m2.ty)) >> 16n);
    const ty = m1.ty + Number((BigInt(m1.b) * BigInt(m2.tx) + BigInt(m1.d) * BigInt(m2.ty)) >> 16n);
    return { a: a | 0, b: b | 0, c: c | 0, d: d | 0, tx: Math.round(tx), ty: Math.round(ty) };
  }

  function transformPoint(m, x, y) {
    const nx = m.tx + Number((BigInt(m.a) * BigInt(Math.round(x)) + BigInt(m.c) * BigInt(Math.round(y))) >> 16n);
    const ny = m.ty + Number((BigInt(m.b) * BigInt(Math.round(x)) + BigInt(m.d) * BigInt(Math.round(y))) >> 16n);
    return { x: Math.round(nx), y: Math.round(ny) };
  }

  function invertMatrix(m) {
    const a = m.a / FIXED_ONE, b = m.b / FIXED_ONE;
    const c = m.c / FIXED_ONE, d = m.d / FIXED_ONE;
    const det = a * d - b * c;
    if (Math.abs(det) < 1e-12) return identityMatrix();
    const invDet = 1 / det;
    const ia = d * invDet, ib = -b * invDet, ic = -c * invDet, id = a * invDet;
    const itx = -(ia * m.tx + ic * m.ty);
    const ity = -(ib * m.tx + id * m.ty);
    return {
      a: toFixed16(ia), b: toFixed16(ib),
      c: toFixed16(ic), d: toFixed16(id),
      tx: Math.round(itx), ty: Math.round(ity)
    };
  }

  // Decompose matrix into translation, rotation (radians), scaleX, scaleY, skewX
  function decomposeMatrix(m) {
    const a = m.a / FIXED_ONE;
    const b = m.b / FIXED_ONE;
    const c = m.c / FIXED_ONE;
    const d = m.d / FIXED_ONE;
    const scaleX = Math.sqrt(a * a + b * b);
    const rotation = scaleX > 1e-9 ? Math.atan2(b, a) : 0;
    const cosR = Math.cos(-rotation);
    const sinR = Math.sin(-rotation);
    // Unrotate second column (c, d)
    const rc = c * cosR - d * sinR;
    const rd = c * sinR + d * cosR;
    const scaleY = rd;
    const skewX = Math.abs(scaleY) > 1e-9 ? Math.atan2(rc, scaleY) : 0;
    return {
      tx: m.tx,
      ty: m.ty,
      scaleX,
      scaleY,
      rotation,
      skewX
    };
  }

  function composeMatrix(dec) {
    const cosR = Math.cos(dec.rotation);
    const sinR = Math.sin(dec.rotation);
    const tanS = Math.tan(dec.skewX || 0);
    // R * SkewX * Scale
    // Scale: [sx, 0; 0, sy], SkewX: [1, tanS; 0, 1] -> [sx, sy*tanS; 0, sy]
    const m00 = dec.scaleX;
    const m01 = dec.scaleY * tanS;
    const m10 = 0;
    const m11 = dec.scaleY;
    const a = cosR * m00 - sinR * m10;
    const b = sinR * m00 + cosR * m10;
    const c = cosR * m01 - sinR * m11;
    const d = sinR * m01 + cosR * m11;
    return {
      a: toFixed16(a),
      b: toFixed16(b),
      c: toFixed16(c),
      d: toFixed16(d),
      tx: Math.round(dec.tx),
      ty: Math.round(dec.ty)
    };
  }

  // RGBA8
  function rgba(r, g, b, a) {
    return {
      r: Math.max(0, Math.min(255, Math.round(r))),
      g: Math.max(0, Math.min(255, Math.round(g))),
      b: Math.max(0, Math.min(255, Math.round(b))),
      a: a === undefined ? 255 : Math.max(0, Math.min(255, Math.round(a)))
    };
  }

  function rgbaEqual(c1, c2) {
    if (!c1 && !c2) return true;
    if (!c1 || !c2) return false;
    return c1.r === c2.r && c1.g === c2.g && c1.b === c2.b && c1.a === c2.a;
  }

  function rgbaToCss(c) {
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (c.a / 255).toFixed(4) + ')';
  }

  function rgbaToHex(c) {
    const h = (n) => n.toString(16).padStart(2, '0');
    return '#' + h(c.r) + h(c.g) + h(c.b);
  }

  function hexToRgba(hex, alpha) {
    const clean = String(hex || '#000000').replace('#', '');
    const r = parseInt(clean.slice(0, 2), 16) || 0;
    const g = parseInt(clean.slice(2, 4), 16) || 0;
    const b = parseInt(clean.slice(4, 6), 16) || 0;
    return rgba(r, g, b, alpha === undefined ? 255 : alpha);
  }

  // Colour transform: multiply (8.8 fixed, 256 = 1.0) + add (-255..255)
  function identityColorTransform() {
    return { mr: 256, mg: 256, mb: 256, ma: 256, ar: 0, ag: 0, ab: 0, aa: 0 };
  }

  function cloneColorTransform(ct) {
    if (!ct) return identityColorTransform();
    return {
      mr: ct.mr | 0, mg: ct.mg | 0, mb: ct.mb | 0, ma: ct.ma | 0,
      ar: ct.ar | 0, ag: ct.ag | 0, ab: ct.ab | 0, aa: ct.aa | 0
    };
  }

  function applyColorTransform(c, ct) {
    if (!ct) return rgba(c.r, c.g, c.b, c.a);
    const ch = (v, m, a) => Math.max(0, Math.min(255, ((v * m) >> 8) + a));
    return {
      r: ch(c.r, ct.mr, ct.ar),
      g: ch(c.g, ct.mg, ct.ag),
      b: ch(c.b, ct.mb, ct.ab),
      a: ch(c.a, ct.ma, ct.aa)
    };
  }

  function composeColorTransform(parent, child) {
    if (!parent) return cloneColorTransform(child);
    if (!child) return cloneColorTransform(parent);
    return {
      mr: (parent.mr * child.mr) >> 8,
      mg: (parent.mg * child.mg) >> 8,
      mb: (parent.mb * child.mb) >> 8,
      ma: (parent.ma * child.ma) >> 8,
      ar: ((parent.mr * child.ar) >> 8) + parent.ar,
      ag: ((parent.mg * child.ag) >> 8) + parent.ag,
      ab: ((parent.mb * child.ab) >> 8) + parent.ab,
      aa: ((parent.ma * child.aa) >> 8) + parent.aa
    };
  }

  // Cubic Bézier to Quadratic Bézier conversion within tolerance (in twips).
  // Uses exact degree-reduction error bound: max error of midpoint quadratic
  // approximation of cubic (P0, P1, P2, P3) is |P3 - 3*P2 + 3*P1 - P0| / (12 * sqrt(3)).
  // Subdivides recursively until error <= toleranceTwips, then rounds to integer twips.
  function cubicToQuadratics(p0, p1, p2, p3, toleranceTwips) {
    const tol = toleranceTwips === undefined ? CUBIC_TOLERANCE_TWIPS : toleranceTwips;
    const out = [];
    const INV_12_SQRT3 = 1 / (12 * Math.sqrt(3)); // ~0.0481125224

    function subdivide(a0, a1, a2, a3, depth) {
      const dx = a3.x - 3 * a2.x + 3 * a1.x - a0.x;
      const dy = a3.y - 3 * a2.y + 3 * a1.y - a0.y;
      const err = Math.sqrt(dx * dx + dy * dy) * INV_12_SQRT3;
      if (err <= tol * 0.5 || depth >= 10) {
        // Midpoint quadratic control point
        const cx = 0.75 * (a1.x + a2.x) - 0.25 * (a0.x + a3.x);
        const cy = 0.75 * (a1.y + a2.y) - 0.25 * (a0.y + a3.y);
        out.push({
          type: 'quad',
          x0: Math.round(a0.x),
          y0: Math.round(a0.y),
          cx: Math.round(cx),
          cy: Math.round(cy),
          x1: Math.round(a3.x),
          y1: Math.round(a3.y)
        });
        return;
      }
      // De Casteljau split at t = 0.5
      const m01 = { x: (a0.x + a1.x) * 0.5, y: (a0.y + a1.y) * 0.5 };
      const m12 = { x: (a1.x + a2.x) * 0.5, y: (a1.y + a2.y) * 0.5 };
      const m23 = { x: (a2.x + a3.x) * 0.5, y: (a2.y + a3.y) * 0.5 };
      const m012 = { x: (m01.x + m12.x) * 0.5, y: (m01.y + m12.y) * 0.5 };
      const m123 = { x: (m12.x + m23.x) * 0.5, y: (m12.y + m23.y) * 0.5 };
      const mid = { x: (m012.x + m123.x) * 0.5, y: (m012.y + m123.y) * 0.5 };
      subdivide(a0, m01, m012, mid, depth + 1);
      subdivide(mid, m123, m23, a3, depth + 1);
    }

    subdivide(p0, p1, p2, p3, 0);
    // Ensure continuity of integer endpoints
    for (let i = 1; i < out.length; i++) {
      out[i].x0 = out[i - 1].x1;
      out[i].y0 = out[i - 1].y1;
    }
    return out;
  }

  function measureCubicToQuadMaxError(p0, p1, p2, p3, quads) {
    let maxErr = 0;
    const samples = 64;
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      const mt = 1 - t;
      const cx = mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x;
      const cy = mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y;
      let minDist = Infinity;
      for (let qIdx = 0; qIdx < quads.length; qIdx++) {
        const q = quads[qIdx];
        for (let j = 0; j <= 16; j++) {
          const u = j / 16;
          const mu = 1 - u;
          const qx = mu * mu * q.x0 + 2 * mu * u * q.cx + u * u * q.x1;
          const qy = mu * mu * q.y0 + 2 * mu * u * q.cy + u * u * q.y1;
          const d = Math.hypot(cx - qx, cy - qy);
          if (d < minDist) minDist = d;
        }
      }
      if (minDist > maxErr) maxErr = minDist;
    }
    return maxErr;
  }

  // Canonical JSON serialization (sorted keys, deterministic)
  function canonicalJson(val) {
    if (val === null || typeof val !== 'object') {
      return JSON.stringify(val);
    }
    if (Array.isArray(val)) {
      return '[' + val.map(canonicalJson).join(',') + ']';
    }
    const keys = Object.keys(val).sort();
    const parts = [];
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (val[k] === undefined) continue;
      parts.push(JSON.stringify(k) + ':' + canonicalJson(val[k]));
    }
    return '{' + parts.join(',') + '}';
  }

      const s = segs[i];
      const u = vKeyToId.get(s.x0 + ',' + s.y0);
      const v = vKeyToId.get(s.x1 + ',' + s.y1);
      if (u === v) continue;
      const edgeIdx = edges.length;
      edges.push({ id: edgeIdx + 1, u, v, cx: null, cy: null, stroke: s.stroke ? cloneStrokeStyle(s.stroke) : null });
      const he0 = halfEdges.length;
      const he1 = he0 + 1;
      halfEdges.push({ id: he0, from: u, to: v, edgeIdx, twin: he1, dx: s.x1 - s.x0, dy: s.y1 - s.y0 });
      halfEdges.push({ id: he1, from: v, to: u, edgeIdx, twin: he0, dx: s.x0 - s.x1, dy: s.y0 - s.y1 });
      outAdj.get(u).push(he0);
      outAdj.get(v).push(he1);
    }

    // 3. Sort outgoing half-edges at each vertex by exact direction
    const outPos = new Int32Array(halfEdges.length);
    for (const [vid, list] of outAdj.entries()) {
      list.sort((a, b) => compareDirection(halfEdges[a].dx, halfEdges[a].dy, halfEdges[b].dx, halfEdges[b].dy));
      for (let i = 0; i < list.length; i++) {
        outPos[list[i]] = i;
      }
    }

    // 4. Trace face cycles
    const visited = new Uint8Array(halfEdges.length);
    const boundedCycles = [];
    const holeCycles = [];

    for (let i = 0; i < halfEdges.length; i++) {
      if (visited[i]) continue;
      const cycVerts = [];
      const cycHEs = [];
      let cur = i;
      let guard = 0;
      while (!visited[cur] && guard <= halfEdges.length) {
        visited[cur] = 1;
        cycHEs.push(cur);
        cycVerts.push(halfEdges[cur].from);
        const twin = halfEdges[cur].twin;
        const v = halfEdges[cur].to;
        const list = outAdj.get(v);
        const pos = outPos[twin];
        // Next half-edge is immediately clockwise from twin -> (pos - 1 + len) % len
        const nextPos = (pos - 1 + list.length) % list.length;
        cur = list[nextPos];
        guard++;
      }
      if (cycVerts.length < 3) continue;
      const area2 = cycleSignedArea2(cycVerts, vById);
      if (area2 > 0n) {
        boundedCycles.push({ verts: cycVerts, hes: cycHEs, area2 });
      } else if (area2 < 0n) {
        holeCycles.push({ verts: cycVerts, hes: cycHEs, area2 });
      }
    }

    // 5. Assign hole cycles to smallest enclosing bounded face
    const faces = boundedCycles.map((bc, idx) => ({
      id: idx + 1,
      outer: bc.verts,
      holes: [],
      fill: null,
      area2: bc.area2,
      _hes: bc.hes
    }));

    for (let h = 0; h < holeCycles.length; h++) {
      const hc = holeCycles[h];
      // Pick a vertex of the hole (not on outer boundary of candidate)
      let testV = vById.get(hc.verts[0]);
      // Find smallest bounded face containing the hole
      let bestFace = null;
      for (let f = 0; f < faces.length; f++) {
        const cand = faces[f];
        if (cand.area2 <= -hc.area2) continue;
        // Check if testV is strictly inside cand.outer (or test midpoint of an edge)
        let inside = false;
        for (let k = 0; k < hc.verts.length; k++) {
          const a = vById.get(hc.verts[k]);
          const b = vById.get(hc.verts[(k + 1) % hc.verts.length]);
          const mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5;
          if (pointInCycle(mx, my, cand.outer, vById)) {
            inside = true;
            break;
          }
        }
        if (inside) {
          if (!bestFace || cand.area2 < bestFace.area2) {
            bestFace = cand;
          }
        }
      }
      if (bestFace) {
        bestFace.holes.push(hc.verts);
        bestFace.area2 += hc.area2; // hc.area2 is negative
      }
    }

    // Map each half-edge to its face index
    const heToFace = new Int32Array(halfEdges.length).fill(-1);
    for (let f = 0; f < faces.length; f++) {
      for (let k = 0; k < faces[f]._hes.length; k++) {
        heToFace[faces[f]._hes[k]] = f;
      }
    }

    return {
      vertices,
      edges,
      faces,
      vById,
      halfEdges,
      heToFace
    };
  }

  // Merge adjacent faces with identical fill style when shared edge has no stroke,
  // and prune stroke-less edges separating two null-fill regions.
  function cleanupAndMergePlanarMap(graph) {
    const keptSegs = [];
    let removedAny = false;

    for (let i = 0; i < graph.edges.length; i++) {
      const e = graph.edges[i];
      const he0 = i * 2;
      const he1 = i * 2 + 1;
      const f0 = graph.heToFace[he0];
      const f1 = graph.heToFace[he1];
      const fill0 = f0 >= 0 ? graph.faces[f0].fill : null;
      const fill1 = f1 >= 0 ? graph.faces[f1].fill : null;

      if (!e.stroke && fillStyleEqual(fill0, fill1)) {
        removedAny = true;
        continue;
      }
      const u = graph.vById.get(e.u);
      const v = graph.vById.get(e.v);
      keptSegs.push({ x0: u.x, y0: u.y, x1: v.x, y1: v.y, stroke: e.stroke });
    }

    if (!removedAny) {
      return {
        vertices: graph.vertices,
        edges: graph.edges,
        faces: graph.faces.map((f) => ({
          id: f.id, outer: f.outer, holes: f.holes, fill: f.fill, area2: Number(f.area2)
        })),
        nextVid: graph.vertices.length + 1,
        nextEid: graph.edges.length + 1,
        nextFid: graph.faces.length + 1
      };
    }

    // Re-extract clean faces from remaining segments and transfer fills
    const rebuilt = buildPlanarGraphFromSegments(keptSegs);
    for (let f = 0; f < rebuilt.faces.length; f++) {
      const pt = computeFaceInteriorPoint(rebuilt.faces[f], rebuilt.vById);
      for (let oldF = 0; oldF < graph.faces.length; oldF++) {
        if (graph.faces[oldF].fill && pointInFace(pt.x, pt.y, graph.faces[oldF], graph.vById)) {
          rebuilt.faces[f].fill = cloneFillStyle(graph.faces[oldF].fill);
          break;
        }
      }
    }

    return {
      vertices: rebuilt.vertices,
      edges: rebuilt.edges,
      faces: rebuilt.faces.map((f) => ({
        id: f.id, outer: f.outer, holes: f.holes, fill: f.fill, area2: Number(f.area2)
      })),
      nextVid: rebuilt.vertices.length + 1,
      nextEid: rebuilt.edges.length + 1,
      nextFid: rebuilt.faces.length + 1
    };
  }

  function mapToRawSegments(map) {
    const vById = new Map();
    for (let i = 0; i < map.vertices.length; i++) vById.set(map.vertices[i].id, map.vertices[i]);
    const segs = [];
    for (let i = 0; i < map.edges.length; i++) {
      const e = map.edges[i];
      const u = vById.get(e.u), v = vById.get(e.v);
      if (!u || !v) continue;
      if (e.cx !== null && e.cx !== undefined) {
        const flat = flattenQuadToTwipSegments({ x0: u.x, y0: u.y, cx: e.cx, cy: e.cy, x1: v.x, y1: v.y }, 2);
        for (let k = 0; k < flat.length; k++) {
          segs.push({ x0: flat[k].x0, y0: flat[k].y0, x1: flat[k].x1, y1: flat[k].y1, stroke: e.stroke });
        }
      } else {
        segs.push({ x0: u.x, y0: u.y, x1: v.x, y1: v.y, stroke: e.stroke });
      }
    }
    return { segs, vById };
  }

  // Convert input path (array of {type:'line',x0,y0,x1,y1} or {type:'quad',x0,y0,cx,cy,x1,y1})
  // to integer-twip line segments for planar arrangement.
  function pathToFlatSegments(pathSegs, stroke) {
    const out = [];
    for (let i = 0; i < pathSegs.length; i++) {
      const s = pathSegs[i];
      if (s.type === 'quad') {
        const flat = flattenQuadToTwipSegments(s, 2);
        for (let k = 0; k < flat.length; k++) {
          out.push({ x0: flat[k].x0, y0: flat[k].y0, x1: flat[k].x1, y1: flat[k].y1, stroke });
        }
      } else {
        out.push({
          x0: Math.round(s.x0), y0: Math.round(s.y0),
          x1: Math.round(s.x1), y1: Math.round(s.y1),
          stroke
        });
      }
    }
    return out;
  }

  function pointInFlatPolygon(px, py, polyPts) {
    let inside = false;
    const n = polyPts.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const a = polyPts[j], b = polyPts[i];
      if ((a.y > py) !== (b.y > py)) {
        const xInt = a.x + ((py - a.y) * (b.x - a.x)) / (b.y - a.y);
        if (px < xInt) inside = !inside;
      }
    }
    return inside;
  }

  // Add a filled shape (closed path of line/quad segments) to the planar map.
  // Cuts shapes beneath, merges overlapping fills of same color.
  function addFill(map, pathSegs, fillStyle, strokeStyle) {
    const fb = checkCurvedFallback(pathSegs, map.edges, map.vertices);
    if (fb.fallback) {
      return { ok: false, fallback: true, reason: fb.reason, map };
    }
    const { segs: oldSegs, vById: oldVById } = mapToRawSegments(map);
    const newSegs = pathToFlatSegments(pathSegs, strokeStyle || null);
    if (newSegs.length < 3) return { ok: true, fallback: false, map };

    const polyPts = newSegs.map((s) => ({ x: s.x0, y: s.y0 }));
    const snapped = snapRoundSegments(oldSegs.concat(newSegs));
    if (!snapped.ok) {
      return { ok: false, fallback: true, reason: snapped.reason, map };
    }

    const graph = buildPlanarGraphFromSegments(snapped.segments);
    for (let f = 0; f < graph.faces.length; f++) {
      const pt = computeFaceInteriorPoint(graph.faces[f], graph.vById);
      if (pointInFlatPolygon(pt.x, pt.y, polyPts)) {
        graph.faces[f].fill = cloneFillStyle(fillStyle);
      } else {
        for (let oldF = 0; oldF < map.faces.length; oldF++) {
          if (map.faces[oldF].fill && pointInFace(pt.x, pt.y, map.faces[oldF], oldVById)) {
            graph.faces[f].fill = cloneFillStyle(map.faces[oldF].fill);
            break;
          }
        }
      }
    }

    const clean = cleanupAndMergePlanarMap(graph);
    return { ok: true, fallback: false, map: clean };
  }

  // Add a stroke (open or closed path of line/quad segments) to the planar map.
  // Splits any fills it crosses.
  function addStroke(map, pathSegs, strokeStyle) {
    const fb = checkCurvedFallback(pathSegs, map.edges, map.vertices);
    if (fb.fallback) {
      return { ok: false, fallback: true, reason: fb.reason, map };
    }
    const { segs: oldSegs, vById: oldVById } = mapToRawSegments(map);
    const newSegs = pathToFlatSegments(pathSegs, strokeStyle);
    if (newSegs.length === 0) return { ok: true, fallback: false, map };

    const snapped = snapRoundSegments(oldSegs.concat(newSegs));
    if (!snapped.ok) {
      return { ok: false, fallback: true, reason: snapped.reason, map };
    }

    const graph = buildPlanarGraphFromSegments(snapped.segments);
    for (let f = 0; f < graph.faces.length; f++) {
      const pt = computeFaceInteriorPoint(graph.faces[f], graph.vById);
      for (let oldF = 0; oldF < map.faces.length; oldF++) {
        if (map.faces[oldF].fill && pointInFace(pt.x, pt.y, map.faces[oldF], oldVById)) {
          graph.faces[f].fill = cloneFillStyle(map.faces[oldF].fill);
          break;
        }
      }
    }

    const clean = cleanupAndMergePlanarMap(graph);
    return { ok: true, fallback: false, map: clean };
  }

  // Erase region: removes regions (not objects) according to mode:
  // 'normal' | 'fills-only' | 'lines-only' | 'inside'
  function eraseRegion(map, eraserPolyPts, mode, startPoint) {
    const eraseMode = mode || 'normal';
    if (!eraserPolyPts || eraserPolyPts.length < 3) return { ok: true, map };
    const { segs: oldSegs, vById: oldVById } = mapToRawSegments(map);

    // If 'inside' mode, identify the face containing startPoint
    let targetFaceIdx = -1;
    if (eraseMode === 'inside' && startPoint) {
      for (let f = 0; f < map.faces.length; f++) {
        if (map.faces[f].fill && pointInFace(startPoint.x, startPoint.y, map.faces[f], oldVById)) {
          targetFaceIdx = f;
          break;
        }
      }
      if (targetFaceIdx < 0) return { ok: true, map };
    }

    const eraserSegs = [];
    for (let i = 0; i < eraserPolyPts.length; i++) {
      const a = eraserPolyPts[i];
      const b = eraserPolyPts[(i + 1) % eraserPolyPts.length];
      eraserSegs.push({ x0: Math.round(a.x), y0: Math.round(a.y), x1: Math.round(b.x), y1: Math.round(b.y), stroke: null });
    }

    const snapped = snapRoundSegments(oldSegs.concat(eraserSegs));
    if (!snapped.ok) {
      return { ok: false, fallback: true, reason: snapped.reason, map };
    }

    const graph = buildPlanarGraphFromSegments(snapped.segments);

    // Remove strokes inside eraser if mode is 'normal' or 'lines-only'
    if (eraseMode === 'normal' || eraseMode === 'lines-only') {
      for (let i = 0; i < graph.edges.length; i++) {
        const e = graph.edges[i];
        if (!e.stroke) continue;
        const u = graph.vById.get(e.u), v = graph.vById.get(e.v);
        const mx = (u.x + v.x) * 0.5, my = (u.y + v.y) * 0.5;
        if (pointInFlatPolygon(mx, my, eraserPolyPts)) {
          e.stroke = null;
        }
      }
    }

    // Re-assign fills, clearing inside eraser
    for (let f = 0; f < graph.faces.length; f++) {
      const pt = computeFaceInteriorPoint(graph.faces[f], graph.vById);
      const inEraser = pointInFlatPolygon(pt.x, pt.y, eraserPolyPts);
      let oldFill = null;
      let oldIdx = -1;
      for (let oldF = 0; oldF < map.faces.length; oldF++) {
        if (map.faces[oldF].fill && pointInFace(pt.x, pt.y, map.faces[oldF], oldVById)) {
          oldFill = map.faces[oldF].fill;
          oldIdx = oldF;
          break;
        }
      }
      if (eraseMode === 'lines-only') {
        graph.faces[f].fill = cloneFillStyle(oldFill);
      } else if (eraseMode === 'inside') {
        if (inEraser && oldIdx === targetFaceIdx) {
          graph.faces[f].fill = null;
        } else {
          graph.faces[f].fill = cloneFillStyle(oldFill);
        }
      } else {
        // 'normal' or 'fills-only'
        graph.faces[f].fill = inEraser ? null : cloneFillStyle(oldFill);
      }
    }

    const clean = cleanupAndMergePlanarMap(graph);
    return { ok: true, fallback: false, map: clean };
  }

  // Paint bucket with gap tolerance ('none' | 'small' | 'medium' | 'large' or numeric twips).
  function paintBucketFill(map, clickX, clickY, fillStyle, gapSetting) {
    const gapTol = typeof gapSetting === 'number' ? gapSetting : (GAP_TOLERANCES[gapSetting] || 0);
    const { segs: oldSegs, vById: oldVById } = mapToRawSegments(map);

    // 1. Check if click is already inside a closed face
    for (let f = 0; f < map.faces.length; f++) {
      if (pointInFace(clickX, clickY, map.faces[f], oldVById)) {
        const nextMap = clonePlanarMap(map);
        nextMap.faces[f].fill = cloneFillStyle(fillStyle);
        // Merge if adjacent face now has same fill
        const graph = buildPlanarGraphFromSegments(oldSegs);
        for (let gf = 0; gf < graph.faces.length; gf++) {
          const pt = computeFaceInteriorPoint(graph.faces[gf], graph.vById);
          for (let nf = 0; nf < nextMap.faces.length; nf++) {
            if (pointInFace(pt.x, pt.y, nextMap.faces[nf], oldVById)) {
              graph.faces[gf].fill = cloneFillStyle(nextMap.faces[nf].fill);
              break;
            }
          }
        }
        return { ok: true, filled: true, map: cleanupAndMergePlanarMap(graph) };
      }
    }

    // 2. If gapTol > 0, find degree-1 open endpoints and bridge gaps <= gapTol
    if (gapTol <= 0 || oldSegs.length === 0) {
      return { ok: true, filled: false, map };
    }

    const deg = new Map();
    const coords = new Map();
    for (let i = 0; i < oldSegs.length; i++) {
      const s = oldSegs[i];
      const k0 = s.x0 + ',' + s.y0;
      const k1 = s.x1 + ',' + s.y1;
      deg.set(k0, (deg.get(k0) || 0) + 1);
      deg.set(k1, (deg.get(k1) || 0) + 1);
      coords.set(k0, { x: s.x0, y: s.y0 });
      coords.set(k1, { x: s.x1, y: s.y1 });
    }
    const openEnds = [];
    for (const [k, d] of deg.entries()) {
      if (d === 1) openEnds.push(coords.get(k));
    }

    const bridges = [];
    for (let i = 0; i < openEnds.length; i++) {
      let bestDist = gapTol + 1e-6;
      let bestTarget = null;
      for (let j = i + 1; j < openEnds.length; j++) {
        const d = Math.hypot(openEnds[i].x - openEnds[j].x, openEnds[i].y - openEnds[j].y);
        if (d > 0 && d <= bestDist) {
          bestDist = d;
          bestTarget = openEnds[j];
        }
      }
      if (bestTarget) {
        bridges.push({ x0: openEnds[i].x, y0: openEnds[i].y, x1: bestTarget.x, y1: bestTarget.y, stroke: null });
      }
    }

    if (bridges.length === 0) {
      return { ok: true, filled: false, map };
    }

    const snapped = snapRoundSegments(oldSegs.concat(bridges));
    if (!snapped.ok) return { ok: false, filled: false, map };
    const graph = buildPlanarGraphFromSegments(snapped.segments);

    let hitFace = -1;
    for (let f = 0; f < graph.faces.length; f++) {
      if (pointInFace(clickX, clickY, graph.faces[f], graph.vById)) {
        hitFace = f;
        break;
      }
    }
    if (hitFace < 0) return { ok: true, filled: false, map };

    // Transfer old fills and set new fill on hitFace
    for (let f = 0; f < graph.faces.length; f++) {
      if (f === hitFace) {
        graph.faces[f].fill = cloneFillStyle(fillStyle);
      } else {
        const pt = computeFaceInteriorPoint(graph.faces[f], graph.vById);
        for (let oldF = 0; oldF < map.faces.length; oldF++) {
          if (map.faces[oldF].fill && pointInFace(pt.x, pt.y, map.faces[oldF], oldVById)) {
            graph.faces[f].fill = cloneFillStyle(map.faces[oldF].fill);
            break;
          }
        }
      }
    }
    return { ok: true, filled: true, map: cleanupAndMergePlanarMap(graph) };
  }

  // Ink bottle: apply stroke to boundary of clicked face or nearest edge
  function inkBottleStroke(map, clickX, clickY, strokeStyle) {
    const vById = new Map();
    for (let i = 0; i < map.vertices.length; i++) vById.set(map.vertices[i].id, map.vertices[i]);
    const nextMap = clonePlanarMap(map);

    // Check if inside a face
    for (let f = 0; f < nextMap.faces.length; f++) {
      if (pointInFace(clickX, clickY, nextMap.faces[f], vById)) {
        const edgeKeys = new Set();
        const cycles = [nextMap.faces[f].outer].concat(nextMap.faces[f].holes);
        for (let c = 0; c < cycles.length; c++) {
          const cyc = cycles[c];
          for (let i = 0; i < cyc.length; i++) {
            const a = cyc[i], b = cyc[(i + 1) % cyc.length];
            edgeKeys.add(Math.min(a, b) + ':' + Math.max(a, b));
          }
        }
        for (let i = 0; i < nextMap.edges.length; i++) {
          const e = nextMap.edges[i];
          if (edgeKeys.has(Math.min(e.u, e.v) + ':' + Math.max(e.u, e.v))) {
            e.stroke = cloneStrokeStyle(strokeStyle);
          }
        }
        return { ok: true, changed: true, map: nextMap };
      }
    }

    // Else nearest edge within 200 twips (10px)
    let bestIdx = -1, bestDist = 200;
    for (let i = 0; i < nextMap.edges.length; i++) {
      const e = nextMap.edges[i];
      const u = vById.get(e.u), v = vById.get(e.v);
      const d = distPointToSeg(clickX, clickY, u.x, u.y, v.x, v.y);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    if (bestIdx >= 0) {
      nextMap.edges[bestIdx].stroke = cloneStrokeStyle(strokeStyle);
      return { ok: true, changed: true, map: nextMap };
    }
    return { ok: true, changed: false, map };
  }

  function distPointToSeg(px, py, x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return Math.hypot(px - x0, py - y0);
    const t = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / len2));
    return Math.hypot(px - (x0 + t * dx), py - (y0 + t * dy));
  }

  // Direct shaping:
  // 1. Move a vertex to (nx, ny)
  function directShapeMoveVertex(map, vertexId, nx, ny) {
    const nextMap = clonePlanarMap(map);
    const v = nextMap.vertices.find((vt) => vt.id === vertexId);
    if (!v) return { ok: false, map };
    v.x = Math.round(nx);
    v.y = Math.round(ny);
    // Re-snap-round to preserve planar invariants
    const { segs, vById } = mapToRawSegments(nextMap);
    const snapped = snapRoundSegments(segs);
    if (!snapped.ok) return { ok: false, fallback: true, reason: snapped.reason, map };
    const graph = buildPlanarGraphFromSegments(snapped.segments);
    for (let f = 0; f < graph.faces.length; f++) {
      const pt = computeFaceInteriorPoint(graph.faces[f], graph.vById);
      for (let oldF = 0; oldF < nextMap.faces.length; oldF++) {
        if (nextMap.faces[oldF].fill && pointInFace(pt.x, pt.y, nextMap.faces[oldF], vById)) {
          graph.faces[f].fill = cloneFillStyle(nextMap.faces[oldF].fill);
          break;
        }
      }
    }
    return { ok: true, map: cleanupAndMergePlanarMap(graph) };
  }

  // 2. Bend an edge into a quadratic curve by dragging its midpoint to (mx, my)
  // On a quad curve, midpoint M = 0.25*P0 + 0.5*C + 0.25*P1 => C = 2*M - 0.5*(P0 + P1)
  function directShapeBendEdge(map, edgeId, mx, my) {
    const nextMap = clonePlanarMap(map);
    const e = nextMap.edges.find((ed) => ed.id === edgeId);
    if (!e) return { ok: false, map };
    const u = nextMap.vertices.find((vt) => vt.id === e.u);
    const v = nextMap.vertices.find((vt) => vt.id === e.v);
    if (!u || !v) return { ok: false, map };
    e.cx = Math.round(2 * mx - 0.5 * (u.x + v.x));
    e.cy = Math.round(2 * my - 0.5 * (u.y + v.y));
    return { ok: true, map: nextMap };
  }

  // 3. Add a corner vertex on an edge (modifier-drag)
  function directShapeAddCorner(map, edgeId, cx, cy) {

    for (let i = 0; i < morphedPts.length; i++) {
      const a = morphedPts[i], b = morphedPts[(i + 1) % morphedPts.length];
      segs.push({ type: 'line', x0: a.x, y0: a.y, x1: b.x, y1: b.y });
    }

    let fill = cA.fill;
    if (cA.fill && cB.fill && cA.fill.type === 'solid' && cB.fill.type === 'solid') {
      fill = { type: 'solid', color: lerpColor(cA.fill.color, cB.fill.color, u) };
    }
    return {
      id: 'morphed_shape',
      paths: [segs],
      fill,
      stroke: cA.stroke,
      matrix: C.identityMatrix()
    };
  }

  // --- Fixed-Timestep Accumulator Playback Clock (§4, mutant #7) ---
  function createPlaybackClock(fps, totalFrames, loop) {
    return {
      fps: Math.max(1, Number(fps || 24)),
      totalFrames: Math.max(1, Math.round(totalFrames || 1)),
      loop: loop !== false,
      frame: 0,
      accumulatorMs: 0,
      playing: false
    };
  }

  function tickPlaybackClock(clock, dtMs) {
    if (!clock.playing || dtMs <= 0) return { advanced: 0, frame: clock.frame };
    const frameDurationMs = 1000 / clock.fps;
    clock.accumulatorMs += dtMs;
    let advanced = 0;
    while (clock.accumulatorMs >= frameDurationMs) {
      clock.accumulatorMs -= frameDurationMs;
      clock.frame += 1;
      advanced += 1;
      if (clock.frame >= clock.totalFrames) {
        if (clock.loop) {
          clock.frame = clock.frame % clock.totalFrames;
        } else {
          clock.frame = clock.totalFrames - 1;
          clock.playing = false;
          clock.accumulatorMs = 0;
          break;
        }
      }
    }
    return { advanced, frame: clock.frame };
  }

  // --- Audio Scheduler & Deterministic WAV/PCM Tools (§5, §7, mutant #8) ---
  function evaluateVolumeEnvelope(envelope, timeSec) {
    if (!envelope || envelope.length === 0) return { left: 1, right: 1 };
    const sorted = envelope.slice().sort((a, b) => a.t - b.t);
    if (timeSec <= sorted[0].t) return { left: sorted[0].left, right: sorted[0].right };
    const last = sorted[sorted.length - 1];
    if (timeSec >= last.t) return { left: last.left, right: last.right };
    for (let i = 0; i + 1 < sorted.length; i++) {
      const a = sorted[i], b = sorted[i + 1];
      if (timeSec >= a.t && timeSec <= b.t) {
        const span = b.t - a.t;
        const f = span > 1e-9 ? (timeSec - a.t) / span : 0;
        return {
          left: a.left + (b.left - a.left) * f,
          right: a.right + (b.right - a.right) * f
        };
      }
    }
    return { left: 1, right: 1 };
  }

  // Compute exact sample-accurate audio events across a timeline
  function computeAudioSchedule(doc, sampleRate) {
    const sr = Math.round(sampleRate || 44100);
    const fps = doc.fps || 24;
    const tl = doc.mainTimeline;
    const events = [];
    for (let li = 0; li < tl.layers.length; li++) {
      const layer = tl.layers[li];
      for (let ki = 0; ki < layer.keyframes.length; ki++) {
        const kf = layer.keyframes[ki];
        if (!kf.sound || !kf.sound.soundId) continue;
        const snd = doc.library.sounds.find((s) => s.id === kf.sound.soundId);
        if (!snd) continue;
        const startTimeSec = kf.frame / fps;
        const startSample = Math.round(startTimeSec * sr);
        // For stream sync, clip ends at next keyframe or timeline end
        let endFrame = tl.totalFrames;
        if (kf.sound.sync === 'stream') {
          const nextKf = layer.keyframes[ki + 1];
          if (nextKf) endFrame = nextKf.frame;
        }
        const durationSec = kf.sound.sync === 'stream'
          ? Math.min((endFrame - kf.frame) / fps, snd.lengthSamples / snd.sampleRate)
          : (snd.lengthSamples / snd.sampleRate);
        events.push({
          layerId: layer.id,
          soundId: snd.id,
          sync: kf.sound.sync || 'event',
          startFrame: kf.frame,
          startTimeSec,
          startSample,
          durationSec,
          durationSamples: Math.round(durationSec * sr),
          envelope: kf.sound.envelope || []
        });
      }
    }
    return events;
  }

  // Encode mono/stereo Float32Array PCM to WAV Uint8Array (16-bit PCM)
  function encodeWavPcm16(samples, sampleRate, channels) {
    const ch = channels || 1;
    const numSamples = samples.length;
    const dataSize = numSamples * 2;
    const buf = new ArrayBuffer(44 + dataSize);
    const view = new DataView(buf);
    function writeStr(off, s) { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, ch, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * ch * 2, true);
    view.setUint16(32, ch * 2, true);
    view.setUint16(34, 16, true);
    writeStr(36, 'data');
    view.setUint32(40, dataSize, true);
    let off = 44;
    for (let i = 0; i < numSamples; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(off, s < 0 ? Math.round(s * 32768) : Math.round(s * 32767), true);
      off += 2;
    }
    return new Uint8Array(buf);
  }

  // Decode 16-bit PCM WAV Uint8Array into { sampleRate, channels, samples: Float32Array }
  function decodeWavPcm16(bytes) {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const channels = view.getUint16(22, true);
    const sampleRate = view.getUint32(24, true);
    // Find 'data' chunk
    let pos = 12;
    while (pos + 8 <= bytes.byteLength) {
      const id = String.fromCharCode(bytes[pos], bytes[pos + 1], bytes[pos + 2], bytes[pos + 3]);
      const sz = view.getUint32(pos + 4, true);
      if (id === 'data') {
        const count = Math.floor(sz / 2);
        const samples = new Float32Array(count);
        for (let i = 0; i < count; i++) {
          samples[i] = view.getInt16(pos + 8 + i * 2, true) / 32768;
        }
        return { sampleRate, channels, samples };
      }
      pos += 8 + sz;
    }
    return { sampleRate, channels, samples: new Float32Array(0) };
  }

  function bytesToBase64(bytes) {
    let bin = '';
    const chunk = 8192;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return typeof btoa === 'function' ? btoa(bin) : Buffer.from(bytes).toString('base64');
  }

  function base64ToBytes(b64) {
    if (typeof atob === 'function') {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    return new Uint8Array(Buffer.from(b64, 'base64'));
  }

  function computeWaveformPeaks(samples, numBuckets) {
    const buckets = Math.max(1, numBuckets || 128);
    const peaks = [];
    const step = Math.max(1, Math.floor(samples.length / buckets));
    for (let b = 0; b < buckets; b++) {
      let maxV = 0;
      const start = b * step;
      const end = Math.min(samples.length, start + step);
      for (let i = start; i < end; i++) {
        const v = Math.abs(samples[i]);
        if (v > maxV) maxV = v;
      }
      peaks.push(Math.round(maxV * 1000) / 1000);
    }
    return peaks;
  }

  // Deterministic offline PCM timeline mixer (matches OfflineAudioContext arithmetic)
  function mixAudioOfflinePCM(doc, sampleRate) {
    const sr = Math.round(sampleRate || 44100);
    const totalSec = doc.mainTimeline.totalFrames / doc.fps;
    const totalSamples = Math.round(totalSec * sr);
    const out = new Float32Array(totalSamples);
    const events = computeAudioSchedule(doc, sr);
    for (let i = 0; i < events.length; i++) {
      const ev = events[i];
      const snd = doc.library.sounds.find((s) => s.id === ev.soundId);
      if (!snd || !snd.pcmBase64) continue;
      const wav = decodeWavPcm16(base64ToBytes(snd.pcmBase64));
      const len = Math.min(ev.durationSamples, wav.samples.length);
      for (let k = 0; k < len; k++) {
        const dstIdx = ev.startSample + k;
        if (dstIdx >= 0 && dstIdx < totalSamples) {
          const env = evaluateVolumeEnvelope(ev.envelope, k / sr);
          out[dstIdx] += wav.samples[k] * env.left;
        }
      }
    }
    // Clamp
    for (let i = 0; i < out.length; i++) {
      if (out[i] > 1) out[i] = 1;
      else if (out[i] < -1) out[i] = -1;
    }
    return { sampleRate: sr, samples: out, events };
  }

  const TweenAudioAPI = {
    applyClassicEase,
    applyCustomCubicEase,
    evaluateTweenEase,
    sampleGuidePath,
    evaluateMotionTween,
    evaluateShapeTween,
    createPlaybackClock,
    tickPlaybackClock,
    evaluateVolumeEnvelope,
    computeAudioSchedule,
    encodeWavPcm16,
    decodeWavPcm16,
    bytesToBase64,
    base64ToBytes,
    computeWaveformPeaks,
    mixAudioOfflinePCM
  };

  Object.assign(root.SpeedsterCore, TweenAudioAPI);
})(typeof window !== 'undefined' ? window : globalThis);

<script id="speedster-app">
// 05-renderer.js — Canvas2D studio renderer with coverage-based mask layers,
// onion skin (outlines & tinted fills), motion & shape tweens, symbols,
// gradients (up to 15 stops), bitmap fills, grid & guides.

(function(root) {
  'use strict';

  const C = root.SpeedsterCore;

  // Image cache for bitmap fills
  const bitmapImageCache = new Map();

  function getCachedBitmapImage(bmp, onLoadCallback) {
    if (!bmp || !bmp.dataUrl) return null;
    let entry = bitmapImageCache.get(bmp.id);
    if (entry && entry.dataUrl === bmp.dataUrl) return entry.img;
    if (typeof Image === 'undefined') return null;
    const img = new Image();
    img.onload = function() { if (onLoadCallback) onLoadCallback(); };
    img.src = bmp.dataUrl;
    entry = { dataUrl: bmp.dataUrl, img };
    bitmapImageCache.set(bmp.id, entry);
    return img;
  }

  function makeCanvasFillStyle(ctx, fill, ct, doc, tintOverride) {
    if (!fill) return null;
    if (tintOverride) return tintOverride;
    if (fill.type === 'solid') {
      const c = C.applyColorTransform(fill.color, ct);
      return C.rgbaToCss(c);
    }
    if (fill.type === 'linear') {
      const grad = ctx.createLinearGradient(fill.x0, fill.y0, fill.x1, fill.y1);
      const stops = (fill.stops || []).slice(0, 15);
      for (let i = 0; i < stops.length; i++) {
        const c = C.applyColorTransform(stops[i].color, ct);
        grad.addColorStop(Math.max(0, Math.min(1, stops[i].offset)), C.rgbaToCss(c));
      }
      return grad;
    }
    if (fill.type === 'radial') {
      const grad = ctx.createRadialGradient(fill.x0, fill.y0, fill.r0 || 0, fill.x1, fill.y1, Math.max(1, fill.r1 || 1000));
      const stops = (fill.stops || []).slice(0, 15);
      for (let i = 0; i < stops.length; i++) {
        const c = C.applyColorTransform(stops[i].color, ct);
        grad.addColorStop(Math.max(0, Math.min(1, stops[i].offset)), C.rgbaToCss(c));
      }
      return grad;
    }
    if (fill.type === 'bitmap' && doc) {
      const bmp = doc.library.bitmaps.find((b) => b.id === fill.bitmapId);
      const img = getCachedBitmapImage(bmp);
      if (img && img.complete && img.naturalWidth > 0) {
        const pat = ctx.createPattern(img, 'repeat');
        if (pat && fill.matrix && typeof DOMMatrix !== 'undefined') {
          const m = fill.matrix;
          pat.setTransform(new DOMMatrix([
            m.a / C.FIXED_ONE, m.b / C.FIXED_ONE,
            m.c / C.FIXED_ONE, m.d / C.FIXED_ONE,
            m.tx, m.ty
          ]));
        }
        return pat;
      }
      return 'rgba(180,180,180,0.5)';
    }
    return null;
  }

  function tracePlanarFace(ctx, face, vById, edgeMap) {
    function traceCycle(cyc) {
      if (!cyc || cyc.length < 3) return;
      const v0 = vById.get(cyc[0]);
      if (!v0) return;
      ctx.moveTo(v0.x, v0.y);
      for (let i = 0; i < cyc.length; i++) {
        const aId = cyc[i];
        const bId = cyc[(i + 1) % cyc.length];
        const vb = vById.get(bId);
        if (!vb) continue;
        const e = edgeMap.get(Math.min(aId, bId) + ':' + Math.max(aId, bId));
        if (e && e.cx !== null && e.cx !== undefined) {
          ctx.quadraticCurveTo(e.cx, e.cy, vb.x, vb.y);
        } else {
          ctx.lineTo(vb.x, vb.y);
        }
      }
      ctx.closePath();
    }
    ctx.beginPath();
    traceCycle(face.outer);
    if (face.holes) {
      for (let h = 0; h < face.holes.length; h++) traceCycle(face.holes[h]);
    }
  }

  function renderPlanarMap(ctx, map, ct, doc, opts) {
    if (!map) return;
    const outlineOnly = opts && opts.outlineOnly;
    const tintColor = opts && opts.tintColor;
    const vById = new Map();
    for (let i = 0; i < map.vertices.length; i++) vById.set(map.vertices[i].id, map.vertices[i]);
    const edgeMap = new Map();
    for (let i = 0; i < map.edges.length; i++) {
      const e = map.edges[i];
      edgeMap.set(Math.min(e.u, e.v) + ':' + Math.max(e.u, e.v), e);
    }

    // 1. Render fills
    for (let f = 0; f < map.faces.length; f++) {
      const face = map.faces[f];
      if (!face.fill) continue;
      tracePlanarFace(ctx, face, vById, edgeMap);
      if (outlineOnly) {
        ctx.strokeStyle = tintColor || '#4f8cff';
        ctx.lineWidth = 20;
        ctx.stroke();
      } else {
        const style = makeCanvasFillStyle(ctx, face.fill, ct, doc, tintColor);
        if (style) {
          ctx.fillStyle = style;
          ctx.fill('evenodd');
        }
      }
    }

    // 2. Render strokes
    for (let i = 0; i < map.edges.length; i++) {
      const e = map.edges[i];
      if (!e.stroke) continue;
      const u = vById.get(e.u), v = vById.get(e.v);
      if (!u || !v) continue;
      ctx.beginPath();
      ctx.moveTo(u.x, u.y);
      if (e.cx !== null && e.cx !== undefined) {
        ctx.quadraticCurveTo(e.cx, e.cy, v.x, v.y);
      } else {
        ctx.lineTo(v.x, v.y);
      }
      ctx.strokeStyle = tintColor || C.rgbaToCss(C.applyColorTransform(e.stroke.color, ct));
      ctx.lineWidth = Math.max(1, e.stroke.width || 20);
      ctx.lineCap = e.stroke.cap || 'round';
      ctx.lineJoin = e.stroke.join || 'round';
      ctx.stroke();
    }
  }

  function renderObjectShape(ctx, obj, ct, doc, opts) {
    if (!obj || !obj.paths) return;
    const outlineOnly = opts && opts.outlineOnly;
    const tintColor = opts && opts.tintColor;
    ctx.save();
    if (obj.matrix) {
      const m = obj.matrix;
      ctx.transform(m.a / C.FIXED_ONE, m.b / C.FIXED_ONE, m.c / C.FIXED_ONE, m.d / C.FIXED_ONE, m.tx, m.ty);
    }
    ctx.beginPath();
    for (let pi = 0; pi < obj.paths.length; pi++) {
      const segs = obj.paths[pi];
      if (!segs || segs.length === 0) continue;
      ctx.moveTo(segs[0].x0, segs[0].y0);
      for (let i = 0; i < segs.length; i++) {
        const s = segs[i];
        if (s.type === 'quad') {
          ctx.quadraticCurveTo(s.cx, s.cy, s.x1, s.y1);
        } else {
          ctx.lineTo(s.x1, s.y1);
        }
      }
    }
    if (obj.fill) {
      if (outlineOnly) {
        ctx.strokeStyle = tintColor || '#4f8cff';
        ctx.lineWidth = 20;
        ctx.stroke();
      } else {
        const style = makeCanvasFillStyle(ctx, obj.fill, ct, doc, tintColor);
        if (style) {
          ctx.fillStyle = style;
          ctx.fill('evenodd');
        }
      }
    }
    if (obj.stroke) {
      ctx.strokeStyle = tintColor || C.rgbaToCss(C.applyColorTransform(obj.stroke.color, ct));
      ctx.lineWidth = Math.max(1, obj.stroke.width || 20);
      ctx.lineCap = obj.stroke.cap || 'round';
      ctx.lineJoin = obj.stroke.join || 'round';
      ctx.stroke();
    }
    ctx.restore();
  }

  function getGuidePathForLayer(timeline, layer, frame) {
    if (!layer.parentId) return null;
    const parent = timeline.layers.find((l) => l.id === layer.parentId);
    if (!parent || parent.type !== 'guide') return null;
    const gkf = C.getKeyframeAt(parent, frame);
    if (!gkf) return null;
    if (gkf.objects && gkf.objects.length > 0 && gkf.objects[0].paths && gkf.objects[0].paths[0]) {
      return gkf.objects[0].paths[0];
    }
    if (gkf.planarMap && gkf.planarMap.edges.length > 0) {
      const vById = new Map();
      for (const v of gkf.planarMap.vertices) vById.set(v.id, v);
      return gkf.planarMap.edges.map((e) => {
        const u = vById.get(e.u), v = vById.get(e.v);
        if (e.cx !== null && e.cx !== undefined) {
          return { type: 'quad', x0: u.x, y0: u.y, cx: e.cx, cy: e.cy, x1: v.x, y1: v.y };
        }
        return { type: 'line', x0: u.x, y0: u.y, x1: v.x, y1: v.y };
      });
    }
    return null;
  }

  function renderLayerAtFrame(ctx, doc, timeline, layer, frame, parentCT, opts) {
    if (!layer || !layer.visible) return;
    if (layer.type === 'folder') return;
    if (layer.type === 'guide' && opts && opts.hideGuides) return;

    const kf = C.getKeyframeAt(layer, frame);
    if (!kf) return;
    const nextKf = C.getNextKeyframeAfter(layer, kf.frame);
    const layerOpts = Object.assign({}, opts, {
      outlineOnly: (opts && opts.outlineOnly) || layer.outline || layer.type === 'guide',
      tintColor: (opts && opts.tintColor) || (layer.type === 'guide' ? 'rgba(180,120,255,0.85)' : null)
    });

    // Check active tween
    if (kf.tween && nextKf && frame > kf.frame && frame < nextKf.frame) {
      const rawT = (frame - kf.frame) / (nextKf.frame - kf.frame);
      if (kf.tween.type === 'motion' && kf.instances.length > 0 && nextKf.instances.length > 0) {
        const guideSegs = getGuidePathForLayer(timeline, layer, frame);
        for (let i = 0; i < kf.instances.length; i++) {
          const instA = kf.instances[i];
          const instB = nextKf.instances.find((b) => b.symbolId === instA.symbolId) || nextKf.instances[0];
          const evalInst = C.evaluateMotionTween(instA, instB, kf.tween, rawT, guideSegs);
          renderInstance(ctx, doc, evalInst, frame, parentCT, layerOpts);
        }
        return;
      }
      if (kf.tween.type === 'shape') {
        const morphed = C.evaluateShapeTween(kf, nextKf, kf.tween, rawT);
        if (morphed) {
          renderObjectShape(ctx, morphed, parentCT, doc, layerOpts);
          return;
        }
      }
    }

    // Regular keyframe content
    renderPlanarMap(ctx, kf.planarMap, parentCT, doc, layerOpts);
    for (let i = 0; i < kf.objects.length; i++) {
      renderObjectShape(ctx, kf.objects[i], parentCT, doc, layerOpts);
    }
    for (let i = 0; i < kf.instances.length; i++) {
      renderInstance(ctx, doc, kf.instances[i], frame - kf.frame, parentCT, layerOpts);
    }
  }

  function renderInstance(ctx, doc, inst, elapsedFrames, parentCT, opts) {
    const sym = doc.library.symbols.find((s) => s.id === inst.symbolId);
    if (!sym || !sym.timeline) return;
    const depth = (opts && opts.depth) || 0;
    if (depth > 8) return; // guard against cyclic symbol references

    let symFrame = 0;
    const total = Math.max(1, sym.timeline.totalFrames);
    if (sym.kind === 'graphic') {
      const ff = inst.firstFrame || 0;
      if (inst.loopMode === 'single-frame') {
        symFrame = ff % total;
      } else if (inst.loopMode === 'play-once') {
        symFrame = Math.min(total - 1, ff + Math.max(0, elapsedFrames));
      } else {
        symFrame = (ff + Math.max(0, elapsedFrames)) % total;
      }
    } else if (sym.kind === 'clip') {
      symFrame = Math.max(0, (opts && opts.clipClockFrame !== undefined ? opts.clipClockFrame : elapsedFrames)) % total;
    } else if (sym.kind === 'button') {
      symFrame = (opts && opts.buttonPreviewState) || 0;
    }

    const composedCT = C.composeColorTransform(parentCT, inst.colorTransform);
    ctx.save();
    const m = inst.matrix;
    ctx.transform(m.a / C.FIXED_ONE, m.b / C.FIXED_ONE, m.c / C.FIXED_ONE, m.d / C.FIXED_ONE, m.tx, m.ty);
    renderTimeline(ctx, doc, sym.timeline, symFrame, composedCT, Object.assign({}, opts, { depth: depth + 1 }));
    ctx.restore();
  }

  // Render an entire timeline with coverage-based mask compositing (NOT bounding box!)
  function renderTimeline(ctx, doc, timeline, frame, parentCT, opts) {
    if (!timeline || !timeline.layers) return;
    const layers = timeline.layers;
    // Build set of masked child layers
    const maskIds = new Set(layers.filter((l) => l.type === 'mask' && l.visible).map((l) => l.id));
    const maskedBy = new Map();
    for (const id of maskIds) maskedBy.set(id, []);
    for (let i = 0; i < layers.length; i++) {
      const l = layers[i];
      if (l.parentId && maskedBy.has(l.parentId)) {
        maskedBy.get(l.parentId).push(l);
      }
    }

    // Draw layers from bottom (last in array) to top (index 0)
    for (let i = layers.length - 1; i >= 0; i--) {
      const layer = layers[i];
      if (!layer.visible) continue;
      if (layer.parentId && maskIds.has(layer.parentId)) continue; // drawn as part of its mask group

      if (layer.type === 'mask') {
        const children = maskedBy.get(layer.id) || [];
        if (children.length === 0) {
          // If no children, render as outline if editing
          if (!(opts && opts.hideGuides)) {
            renderLayerAtFrame(ctx, doc, timeline, layer, frame, parentCT, Object.assign({}, opts, { outlineOnly: true, tintColor: 'rgba(255,190,60,0.7)' }));
          }
          continue;
        }
        // Coverage-based mask compositing using offscreen canvases
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        if (typeof document !== 'undefined' && w > 0 && h > 0) {
          const contentCanvas = document.createElement('canvas');
          contentCanvas.width = w; contentCanvas.height = h;
          const cCtx = contentCanvas.getContext('2d');
          cCtx.setTransform(ctx.getTransform());
          for (let ci = children.length - 1; ci >= 0; ci--) {
            renderLayerAtFrame(cCtx, doc, timeline, children[ci], frame, parentCT, opts);
          }

// 06-storage-audio.js — IndexedDB autosave (try/catch safe, supports multi-MB WAVs),
// live Web Audio playback & stream scrubbing, and rebindable keybindings.

(function(root) {
  'use strict';

  const C = root.SpeedsterCore;

  // --- IndexedDB Autosave (NEVER Web Storage) ---
  const DB_NAME = 'SpeedsterStudioDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'autosave';
  const DOC_KEY = 'current_document';
  const KEYS_KEY = 'keybindings';

  function openAutosaveDB() {
    return new Promise((resolve, reject) => {
      try {
        if (typeof indexedDB === 'undefined') {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = function(ev) {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = function(ev) { resolve(ev.target.result); };
        req.onerror = function(ev) { reject(ev.target.error || new Error('IndexedDB open failed')); };
      } catch (err) {
        reject(err);
      }
    });
  }

  async function saveToIndexedDB(key, value) {
    try {
      const db = await openAutosaveDB();
      return await new Promise((resolve, reject) => {
        try {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(value, key);
          tx.oncomplete = function() { db.close(); resolve(true); };
          tx.onerror = function(ev) { db.close(); reject(ev.target.error || new Error('IDB put error')); };
        } catch (err) {
          db.close();
          reject(err);
        }
      });
    } catch (err) {
      return false;
    }
  }

  async function loadFromIndexedDB(key) {
    try {
      const db = await openAutosaveDB();
      return await new Promise((resolve, reject) => {
        try {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = function() { db.close(); resolve(req.result === undefined ? null : req.result); };
          req.onerror = function(ev) { db.close(); reject(ev.target.error || new Error('IDB get error')); };
        } catch (err) {
          db.close();
          reject(err);
        }
      });
    } catch (err) {
      return null;
    }
  }

  async function saveDocumentAutosave(doc) {
    try {
      const json = C.serializeDocument(doc);
      return await saveToIndexedDB(DOC_KEY, { json, savedAt: Date.now() });
    } catch (err) {
      return false;
    }
  }

  async function loadDocumentAutosave() {
    try {
      const rec = await loadFromIndexedDB(DOC_KEY);
      if (!rec || !rec.json) return null;
      return C.deserializeDocument(rec.json);
    } catch (err) {
      return null;
    }
  }

  // --- Default Rebindable Keybindings (our own clean defaults) ---
  const DEFAULT_KEYBINDINGS = {
    tool_select: 'v',
    tool_pencil: 'p',
    tool_brush: 'b',
    tool_line: 'l',
    tool_rect: 'r',
    tool_ellipse: 'o',
    tool_polygon: 'g',
    tool_pen: 'n',
    tool_bucket: 'k',
    tool_inkbottle: 'i',
    tool_eyedropper: 'd',
    tool_eraser: 'e',
    tool_hand: 'h',
    step_back: ',',
    step_forward: '.',

    fit_window: 'f',
    insert_keyframe: 'F6',
    insert_blank_keyframe: 'F7',
    insert_frame: 'F5'
  };

  // --- Web Audio Engine (live playback + stream scrubbing + offline render) ---
  function createAudioEngine() {
    let audioCtx = null;
    const decodedCache = new Map(); // soundId -> AudioBuffer
    const activeNodes = [];

    function ensureContext() {
      if (audioCtx) return audioCtx;
      const AC = typeof AudioContext !== 'undefined' ? AudioContext :

      if (!AC) return null;
      try {

      }
      return audioCtx;
    }

    async function decodeSound(snd) {
      if (!snd || !snd.pcmBase64) return null;
      if (decodedCache.has(snd.id)) return decodedCache.get(snd.id);
      const ctx = ensureContext();
      if (!ctx) return null;
      try {
        const bytes = C.base64ToBytes(snd.pcmBase64);
        const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        const buf = await ctx.decodeAudioData(copy);
        decodedCache.set(snd.id, buf);
        return buf;
      } catch (err) {
        // Fallback: manual WAV decode into AudioBuffer
        try {
          const wav = C.decodeWavPcm16(C.base64ToBytes(snd.pcmBase64));
          const buf = ctx.createBuffer(1, Math.max(1, wav.samples.length), wav.sampleRate || 44100);
          buf.getChannelData(0).set(wav.samples);
          decodedCache.set(snd.id, buf);

        } catch (err2) {
          return null;
        }
      }
    }

    function stopAll() {
      while (activeNodes.length > 0) {
        const n = activeNodes.pop();
        try { n.stop(); } catch (_) {}
      }
    }

    // Play a short slice of stream audio at `frame` when scrubbing
    async function scrubStreamAtFrame(doc, frame) {
      const ctx = ensureContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (_) {} }
      stopAll();
      const fps = doc.fps || 24;
      const sliceDur = Math.max(0.03, 1 / fps);
      const events = C.computeAudioSchedule(doc, ctx.sampleRate);
      const tNow = frame / fps;
      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (ev.sync !== 'stream') continue;
        if (tNow >= ev.startTimeSec && tNow < ev.startTimeSec + ev.durationSec) {
          const snd = doc.library.sounds.find((s) => s.id === ev.soundId);
          const buf = await decodeSound(snd);
          if (!buf) continue;
          const offset = tNow - ev.startTimeSec;
          const src = ctx.createBufferSource();
          src.buffer = buf;
          const gain = ctx.createGain();
          const env = C.evaluateVolumeEnvelope(ev.envelope, offset);
          gain.gain.value = env.left;
          src.connect(gain);
          gain.connect(ctx.destination);
          src.start(0, Math.max(0, offset), sliceDur);
          activeNodes.push(src);
        }
      }
    }

    // Trigger sounds on frame entry during playback
    async function onPlaybackFrame(doc, frame, isStart) {
      const ctx = ensureContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (_) {} }
      const fps = doc.fps || 24;
      const events = C.computeAudioSchedule(doc, ctx.sampleRate);
      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        const snd = doc.library.sounds.find((s) => s.id === ev.soundId);
        if (!snd) continue;
        if (ev.startFrame === frame || (isStart && ev.sync === 'stream' && frame > ev.startFrame && (frame / fps) < ev.startTimeSec + ev.durationSec)) {
          const buf = await decodeSound(snd);
          if (!buf) continue;
          const offset = Math.max(0, (frame - ev.startFrame) / fps);
          const remaining = Math.max(0.01, ev.durationSec - offset);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          const gain = ctx.createGain();
          const env = C.evaluateVolumeEnvelope(ev.envelope, offset);
          gain.gain.value = env.left;
          src.connect(gain);
          gain.connect(ctx.destination);
          src.start(0, offset, remaining);
          activeNodes.push(src);
        }
      }
    }

    // Browser OfflineAudioContext render for test suite (§7)
    async function renderTimelineOfflineBrowser(doc, sampleRate) {
      const sr = Math.round(sampleRate || 44100);
      const totalSamples = Math.max(1, Math.round((doc.mainTimeline.totalFrames / doc.fps) * sr));
      const OAC = typeof OfflineAudioContext !== 'undefined' ? OfflineAudioContext : null;
      if (!OAC) {
        return C.mixAudioOfflinePCM(doc, sr);
      }
      const oac = new OAC(1, totalSamples, sr);
      const events = C.computeAudioSchedule(doc, sr);
      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        const snd = doc.library.sounds.find((s) => s.id === ev.soundId);
        if (!snd || !snd.pcmBase64) continue;
        let audioBuf = null;
        try {
          const bytes = C.base64ToBytes(snd.pcmBase64);
          const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          audioBuf = await oac.decodeAudioData(copy);
        } catch (_) {
          const wav = C.decodeWavPcm16(C.base64ToBytes(snd.pcmBase64));
          audioBuf = oac.createBuffer(1, Math.max(1, wav.samples.length), wav.sampleRate || sr);
          audioBuf.getChannelData(0).set(wav.samples);
        }
        if (!audioBuf) continue;
        const src = oac.createBufferSource();
        src.buffer = audioBuf;
        const gain = oac.createGain();
        const env = ev.envelope && ev.envelope.length > 0 ? ev.envelope : [{ t: 0, left: 1, right: 1 }];
        gain.gain.setValueAtTime(env[0].left, ev.startTimeSec);
        for (let k = 1; k < env.length; k++) {

        }
        src.connect(gain);
        gain.connect(oac.destination);
        src.start(ev.startTimeSec, 0, ev.durationSec);
      }
      const rendered = await oac.startRendering();
      return { sampleRate: sr, samples: rendered.getChannelData(0), events };
    }

      decodeSound,
      stopAll,
      scrubStreamAtFrame,
      onPlaybackFrame,
      renderTimelineOfflineBrowser

        else if (k === 'text') node.textContent = String(v);

        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);

      const list = Array.isArray(children) ? children : [children];
      for (let i = 0; i < list.length; i++) {

    // --- Core Actions ---
    function selectTool(toolId) {
      state.tool = toolId;
      state.penDraft = null;
      for (const k of Object.keys(dom.toolButtons)) {
        dom.toolButtons[k].classList.toggle('active', k === toolId);

    function switchSidebar(tab) {
      state.sidebarTab = tab;
      dom.tabProps.classList.toggle('active', tab === 'props');
      dom.tabLib.classList.toggle('active', tab === 'library');
      renderSidebar();
    }

    function performUndo() {
      const prev = C.undo(state.undoStack);
      if (!prev) { setStatus('Nothing to undo.'); return; }
      state.doc = prev;
      markDirty();
      setStatus('Undid last gesture (' + state.undoStack.past.length + ' steps left).');
      renderAll();
    }

    function performRedo() {
      const next = C.redo(state.undoStack);
      if (!next) { setStatus('Nothing to redo.'); return; }
      state.doc = next;
      markDirty();
      setStatus('Redid gesture.');
      renderAll();
    }

    function fitStageToWindow() {
      const rect = dom.stageWrap.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const sw = state.doc.stageWidth / C.TWIPS_PER_PX;
      const sh = state.doc.stageHeight / C.TWIPS_PER_PX;
      const z = Math.min((rect.width - 40) / sw, (rect.height - 40) / sh);
      state.zoom = Math.max(0.04, Math.min(20, z));
      state.panX = (rect.width - sw * state.zoom) * 0.5;
      state.panY = (rect.height - sh * state.zoom) * 0.5;
      dom.zoomLabel.textContent = Math.round(state.zoom * 100) + '%';
      renderStage();
    }

    function setCurrentFrame(f, triggerAudioScrub) {
      const tl = getActiveTimeline();
      const clamped = Math.max(0, Math.min(tl.totalFrames - 1, Math.round(f)));
      state.currentFrame = clamped;
      state.clock.frame = clamped;
      dom.frameReadout.textContent = 'F ' + (clamped + 1) + ' / ' + tl.totalFrames;
      const t0 = performance.now();
      renderStage();
      renderTimelineCanvas();
      const dt = performance.now() - t0;
      if (triggerAudioScrub) {
        state.metrics.scrubFrameTimesMs.push(dt);
        audioEngine.scrubStreamAtFrame(state.doc, clamped);
      }
    }

    function stepFrame(delta) {
      const tl = getActiveTimeline();
      let next = state.currentFrame + delta;
      if (next < 0) next = tl.totalFrames - 1;
      if (next >= tl.totalFrames) next = 0;
      setCurrentFrame(next, true);
    }

    function togglePlayback() {
      state.playing = !state.playing;
      state.clock.playing = state.playing;
      state.clock.fps = state.doc.fps;
      state.clock.totalFrames = getActiveTimeline().totalFrames;
      state.clock.frame = state.currentFrame;
      state.clock.accumulatorMs = 0;
      dom.playBtn.textContent = state.playing ? 'Stop' : 'Play';
      dom.playBtn.classList.toggle('active', state.playing);
      if (state.playing) {
        state.metrics.playbackFramesRendered = 0;
        state.metrics.playbackElapsedMs = 0;
        state.lastRafTs = performance.now();
        audioEngine.onPlaybackFrame(state.doc, state.currentFrame, true);
      } else {
        audioEngine.stopAll();
      }
    }

    function addLayerAction(type) {
      const tl = getActiveTimeline();
      C.beginGesture(state.undoStack, 'add-layer');
      const lyr = C.createLayer(state.doc, type.charAt(0).toUpperCase() + type.slice(1) + ' ' + (tl.layers.length + 1), type, null);
      tl.layers.unshift(lyr);
      state.activeLayerId = lyr.id;
      C.commitGesture(state.undoStack, state.doc);
      markDirty();
      renderAll();
    }

    function insertKeyframeAction(isBlank) {
      const tl = getActiveTimeline();
      const layer = getActiveLayer();
      if (!layer) return;
      C.beginGesture(state.undoStack, isBlank ? 'blank-kf' : 'kf');
      if (isBlank) C.insertBlankKeyframe(tl, layer.id, state.currentFrame);
      else C.insertKeyframe(tl, layer.id, state.currentFrame);
      C.commitGesture(state.undoStack, state.doc);
      markDirty();
      renderAll();
    }

    function insertFrameAction() {
      const tl = getActiveTimeline();
      const layer = getActiveLayer();
      if (!layer) return;
      C.beginGesture(state.undoStack, 'insert-frame');
      C.insertFrames(tl, layer.id, state.currentFrame, 1);
      C.commitGesture(state.undoStack, state.doc);

    function removeFrameAction() {

      const layer = getActiveLayer();
      if (!layer) return;
      C.beginGesture(state.undoStack, 'remove-frame');
      C.removeFrames(tl, layer.id, state.currentFrame, 1);

    function copySpanAction() {
      const tl = getActiveTimeline();
      const span = state.selectionSpan || { layerId: state.activeLayerId, start: state.currentFrame, end: state.currentFrame };
      state.frameClipboard = C.copyFrameSpan(tl, span.layerId, span.start, span.end);
      setStatus('Copied frames ' + (span.start + 1) + '–' + (span.end + 1) + '.');

    function pasteSpanAction() {
      if (!state.frameClipboard) { setStatus('Clipboard is empty.'); return; }
      const tl = getActiveTimeline();
      C.beginGesture(state.undoStack, 'paste-span');
      C.pasteFrameSpan(tl, state.activeLayerId, state.currentFrame, state.frameClipboard);

      markDirty();
      setStatus('Pasted frame span at frame ' + (state.currentFrame + 1) + '.');
      renderAll();
