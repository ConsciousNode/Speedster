    // --- Commit Geometry to Active Keyframe (Merge Planar Map or Object Drawing) ---
    function commitFillShape(pathSegs, fillStyle, strokeStyle) {
      const kf = getActiveKeyframe(true);
      if (!kf) return;
      if (state.objectDrawing) {
        kf.objects.push({
          id: C.allocId(state.doc, 'obj'),
          paths: [pathSegs],
          fill: fillStyle,
          stroke: strokeStyle,
          matrix: C.identityMatrix()
        });
        C.recomputeKeyframeBlank(kf);
        return;
      }
      const res = C.addFill(kf.planarMap, pathSegs, fillStyle, strokeStyle);
      if (res.ok && !res.fallback) {
        kf.planarMap = res.map;
      } else {
        // Explicit honest fallback to object drawing — never silent!
        kf.objects.push({
          id: C.allocId(state.doc, 'obj'),
          paths: [pathSegs],
          fill: fillStyle,
          stroke: strokeStyle,
          matrix: C.identityMatrix()
        });
        state.metrics.fallbackEvents.push({ reason: res.reason, frame: state.currentFrame });
        setStatus('Planar map fallback (' + res.reason + '): stored as Object Drawing.', true);
      }
      C.recomputeKeyframeBlank(kf);
    }

    function commitStrokePath(pathSegs, strokeStyle) {
      const kf = getActiveKeyframe(true);
      if (!kf) return;
      if (state.objectDrawing) {
        kf.objects.push({
          id: C.allocId(state.doc, 'obj'),
          paths: [pathSegs],
          fill: null,
          stroke: strokeStyle,
          matrix: C.identityMatrix()
        });
        C.recomputeKeyframeBlank(kf);
        return;
      }
      const res = C.addStroke(kf.planarMap, pathSegs, strokeStyle);
      if (res.ok && !res.fallback) {
        kf.planarMap = res.map;
      } else {
        kf.objects.push({
          id: C.allocId(state.doc, 'obj'),
          paths: [pathSegs],
          fill: null,
          stroke: strokeStyle,
          matrix: C.identityMatrix()
        });
        state.metrics.fallbackEvents.push({ reason: res.reason, frame: state.currentFrame });
        setStatus('Planar map fallback (' + res.reason + '): stored as Object Drawing.', true);
      }
      C.recomputeKeyframeBlank(kf);
    }

    // --- Freehand Stroke Processing (Brush ribbon + Pencil Straighten/Smooth/Ink) ---
    function simplifyPolyline(pts, epsTwips) {
      if (pts.length <= 2) return pts.slice();
      let maxD = 0, idx = 0;
      const a = pts[0], b = pts[pts.length - 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      for (let i = 1; i < pts.length - 1; i++) {
        const d = Math.abs((pts[i].x - a.x) * dy - (pts[i].y - a.y) * dx) / len;
        if (d > maxD) { maxD = d; idx = i; }
      }
      if (maxD > epsTwips) {
        const left = simplifyPolyline(pts.slice(0, idx + 1), epsTwips);
        const right = simplifyPolyline(pts.slice(idx), epsTwips);
        return left.slice(0, -1).concat(right);
      }
      return [a, b];
    }

    function buildBrushOutlinePolygon(pts, baseWidthTwips) {
      if (pts.length < 2) {
        const p = pts[0];
        const r = Math.max(20, baseWidthTwips * 0.5);
        return C.makePolygonPath(p.x, p.y, r, 8);
      }
      const leftPts = [], rightPts = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const prev = pts[Math.max(0, i - 1)];
        const next = pts[Math.min(pts.length - 1, i + 1)];
        let dx = next.x - prev.x, dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        const nx = -dy, ny = dx;
        // Width: pen pressure if provided (>0 and !== 0.5 default mouse), else speed-based width
        let factor = 1.0;
        if (p.hasPenPressure) {
          factor = 0.25 + 1.15 * Math.max(0.05, Math.min(1, p.pressure));
        } else {
          // Speed-based width (mouse/touch first-class): faster = thinner, slower = thicker
          const dt = Math.max(1, (p.t - prev.t));
          const speedPxPerMs = (Math.hypot(p.x - prev.x, p.y - prev.y) / C.TWIPS_PER_PX) / dt;
          factor = Math.max(0.35, Math.min(1.35, 1.25 - speedPxPerMs * 0.45));
        }
        const hw = Math.max(15, baseWidthTwips * 0.5 * factor);
        leftPts.push({ x: Math.round(p.x + nx * hw), y: Math.round(p.y + ny * hw) });
        rightPts.push({ x: Math.round(p.x - nx * hw), y: Math.round(p.y - ny * hw) });
      }
      const ring = leftPts.concat(rightPts.reverse());
      const segs = [];
      for (let i = 0; i < ring.length; i++) {
        const a = ring[i], b = ring[(i + 1) % ring.length];
        if (a.x !== b.x || a.y !== b.y) {
          segs.push({ type: 'line', x0: a.x, y0: a.y, x1: b.x, y1: b.y });
        }
      }
      return segs;
    }

    function buildPencilSegments(pts, mode) {
      if (pts.length < 2) return [];
      if (mode === 'straighten') {
        const simp = simplifyPolyline(pts, 180);
        const segs = [];
        for (let i = 0; i + 1 < simp.length; i++) {
          segs.push({ type: 'line', x0: Math.round(simp[i].x), y0: Math.round(simp[i].y), x1: Math.round(simp[i + 1].x), y1: Math.round(simp[i + 1].y) });
        }
        return segs;
      }
      if (mode === 'smooth') {
        // Fit smooth Catmull-Rom cubics, then convert every cubic to quadratics within CUBIC_TOLERANCE_TWIPS!
        const simp = simplifyPolyline(pts, 60);
        if (simp.length === 2) {
          return [{ type: 'line', x0: Math.round(simp[0].x), y0: Math.round(simp[0].y), x1: Math.round(simp[1].x), y1: Math.round(simp[1].y) }];
        }
        const segs = [];
        for (let i = 0; i + 1 < simp.length; i++) {
          const p0 = simp[Math.max(0, i - 1)];
          const p1 = simp[i];
          const p2 = simp[i + 1];
          const p3 = simp[Math.min(simp.length - 1, i + 2)];
          const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
          const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
          const quads = C.cubicToQuadratics(p1, c1, c2, p2, C.CUBIC_TOLERANCE_TWIPS);
          for (let q = 0; q < quads.length; q++) segs.push(quads[q]);
        }
        return segs;
      }
      // 'ink' mode
      const simp = simplifyPolyline(pts, 25);
      const segs = [];
      for (let i = 0; i + 1 < simp.length; i++) {
        segs.push({ type: 'line', x0: Math.round(simp[i].x), y0: Math.round(simp[i].y), x1: Math.round(simp[i + 1].x), y1: Math.round(simp[i + 1].y) });
      }
      return segs;
    }

    // --- Direct Shaping Hit-Test ---
    function hitTestDirectShape(twPt) {
      const kf = getActiveKeyframe(false);
      if (!kf || !kf.planarMap) return null;
      const map = kf.planarMap;
      const tol = Math.round(200 / Math.max(0.25, state.zoom)); // ~10px in screen space
      const vById = new Map();
      for (const v of map.vertices) {
        vById.set(v.id, v);
        if (Math.hypot(twPt.x - v.x, twPt.y - v.y) <= tol) {
          return { kind: 'vertex', id: v.id, x: v.x, y: v.y };
        }
      }
      for (const e of map.edges) {
        const u = vById.get(e.u), v = vById.get(e.v);
        if (!u || !v) continue;
        // Sample curve/line midpoint
        const mx = e.cx !== null && e.cx !== undefined ? (0.25 * u.x + 0.5 * e.cx + 0.25 * v.x) : (u.x + v.x) * 0.5;
        const my = e.cy !== null && e.cy !== undefined ? (0.25 * u.y + 0.5 * e.cy + 0.25 * v.y) : (u.y + v.y) * 0.5;
        if (Math.hypot(twPt.x - mx, twPt.y - my) <= tol * 1.4) {
          return { kind: 'edge', id: e.id, x: mx, y: my };
        }
      }
      return null;
    }

    // --- Pointer & Touch Event Handling (Coalesced Events + 2-Finger Pan/Pinch + Palm-Safe) ---
    function isPalmRejected(ev) {
      if (!state.palmSafe) return false;
      if (ev.pointerType === 'touch') {
        if ((ev.width && ev.width > 32) || (ev.height && ev.height > 32)) return true;
      }
      return false;
    }

    dom.stageCanvas.addEventListener('pointerdown', (ev) => {
      if (isPalmRejected(ev)) return;
      dom.stageCanvas.setPointerCapture(ev.pointerId);
      state.activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, type: ev.pointerType });

      // Two-finger touch pan + pinch zoom
      if (state.activePointers.size === 2) {
        state.drawingStroke = null;
        const pts = Array.from(state.activePointers.values());
        state.pinchStart = {
          dist: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1,
          midX: (pts[0].x + pts[1].x) * 0.5,
          midY: (pts[0].y + pts[1].y) * 0.5,
          zoom: state.zoom,
          panX: state.panX,
          panY: state.panY
        };
        return;
      }

      // Pan via middle button, spacebar, or hand tool
      if (ev.button === 1 || state.spaceDown || state.tool === 'hand') {
        state.panDrag = { startX: ev.clientX, startY: ev.clientY, panX: state.panX, panY: state.panY };
        return;
      }

      const layer = getActiveLayer();
      if (layer && layer.locked) { setStatus('Layer "' + layer.name + '" is locked.', true); return; }

      const rawTw = screenToStageTwips(ev.clientX, ev.clientY);
      const tw = applySnapping(rawTw);
      const now = performance.now();

      if (state.tool === 'select') {
        const hit = hitTestDirectShape(rawTw);
        if (hit) {
          C.beginGesture(state.undoStack, 'direct-shape');
          state.directDrag = {
            kind: (hit.kind === 'edge' && ev.altKey) ? 'corner' : hit.kind,
            id: hit.id,
            startX: rawTw.x,
            startY: rawTw.y
          };
          return;
        }
        // Check symbol instance hit
        const kf = getActiveKeyframe(false);
        if (kf && kf.instances.length > 0) {
          for (let i = kf.instances.length - 1; i >= 0; i--) {
            const inst = kf.instances[i];
            if (Math.hypot(rawTw.x - inst.matrix.tx, rawTw.y - inst.matrix.ty) < 800) {
              state.selectedInstanceId = inst.id;
              C.beginGesture(state.undoStack, 'move-instance');
              state.directDrag = { kind: 'instance', id: inst.id, startX: rawTw.x, startY: rawTw.y, origTx: inst.matrix.tx, origTy: inst.matrix.ty };
              renderSidebar();
              renderStage();
              return;
            }
          }
        }
        state.selectedInstanceId = null;
        renderSidebar();
        renderStage();
        return;
      }

      if (state.tool === 'bucket') {
        const kf = getActiveKeyframe(true);
        C.beginGesture(state.undoStack, 'paint-bucket');
        const res = C.paintBucketFill(kf.planarMap, rawTw.x, rawTw.y, currentFillStyle(), state.bucketGap);
        if (res.filled) {
          kf.planarMap = res.map;
          C.recomputeKeyframeBlank(kf);
          C.commitGesture(state.undoStack, state.doc);
          markDirty();
          setStatus('Filled region (gap tolerance: ' + state.bucketGap + ').');
        } else {
          C.cancelGesture(state.undoStack);
          setStatus('No enclosed region found within gap tolerance (' + state.bucketGap + ').');
        }
        renderAll();
        return;
      }

      if (state.tool === 'inkbottle') {
        const kf = getActiveKeyframe(false);
        if (!kf) return;
        C.beginGesture(state.undoStack, 'ink-bottle');
        const res = C.inkBottleStroke(kf.planarMap, rawTw.x, rawTw.y, currentStrokeStyle());
        if (res.changed) {
          kf.planarMap = res.map;
          C.commitGesture(state.undoStack, state.doc);
          markDirty();
          setStatus('Applied stroke with Ink Bottle.');
        } else {
          C.cancelGesture(state.undoStack);
        }
        renderAll();
        return;
      }

      if (state.tool === 'eyedropper') {
        const kf = getActiveKeyframe(false);
        if (kf && kf.planarMap) {
          const vById = new Map();
          for (const v of kf.planarMap.vertices) vById.set(v.id, v);
          for (const f of kf.planarMap.faces) {
            if (f.fill && f.fill.type === 'solid' && C.pointInFace(rawTw.x, rawTw.y, f, vById)) {
              state.fillColor = C.rgba(f.fill.color.r, f.fill.color.g, f.fill.color.b, f.fill.color.a);
              state.fillType = 'solid';
              setStatus('Picked fill color ' + C.rgbaToHex(state.fillColor));
              renderSidebar();
              return;
            }
          }
        }
        return;
      }

      if (state.tool === 'pen') {
        if (!state.penDraft) {
          state.penDraft = { anchors: [] };
        }
        state.penDraft.anchors.push({ x: tw.x, y: tw.y, inX: tw.x, inY: tw.y, outX: tw.x, outY: tw.y });
        state.penDraft.draggingHandle = true;
        renderStage();
        return;
      }

      if (state.tool === 'brush' || state.tool === 'pencil' || state.tool === 'eraser') {
        C.beginGesture(state.undoStack, state.tool);
        const hasPenPressure = ev.pointerType === 'pen' && ev.pressure > 0;
        state.drawingStroke = {
          tool: state.tool,
          pts: [{ x: tw.x, y: tw.y, t: now, pressure: ev.pressure || 0.5, hasPenPressure }],
          lastInputTs: now,
          previewDirty: true
        };
        scheduleLivePreview();
        return;
      }

      if (['line', 'rect', 'ellipse', 'polygon'].includes(state.tool)) {
        C.beginGesture(state.undoStack, state.tool);
        state.shapeDrag = { kind: state.tool, startX: tw.x, startY: tw.y, curX: tw.x, curY: tw.y };
        renderStage();
      }
    });

    dom.stageCanvas.addEventListener('pointermove', (ev) => {
      if (isPalmRejected(ev)) return;
      if (state.activePointers.has(ev.pointerId)) {
        state.activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, type: ev.pointerType });
      }

      // Two-finger pan & pinch zoom
      if (state.activePointers.size === 2 && state.pinchStart) {
        const t0 = performance.now();
        const pts = Array.from(state.activePointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
        const midX = (pts[0].x + pts[1].x) * 0.5;
        const midY = (pts[0].y + pts[1].y) * 0.5;
        const rect = dom.stageCanvas.getBoundingClientRect();
        const localMidX = midX - rect.left;
        const localMidY = midY - rect.top;
        const newZoom = Math.max(0.04, Math.min(20, state.pinchStart.zoom * (dist / state.pinchStart.dist)));
        const stageMidX = (state.pinchStart.midX - rect.left - state.pinchStart.panX) / state.pinchStart.zoom;
        const stageMidY = (state.pinchStart.midY - rect.top - state.pinchStart.panY) / state.pinchStart.zoom;
        state.zoom = newZoom;
        state.panX = localMidX - stageMidX * newZoom;
        state.panY = localMidY - stageMidY * newZoom;
        dom.zoomLabel.textContent = Math.round(state.zoom * 100) + '%';
        renderStage();
        state.metrics.zoomPanFrameTimesMs.push(performance.now() - t0);
        return;
      }

      if (state.panDrag) {
        const t0 = performance.now();
        state.panX = state.panDrag.panX + (ev.clientX - state.panDrag.startX);
        state.panY = state.panDrag.panY + (ev.clientY - state.panDrag.startY);
        renderStage();
        state.metrics.zoomPanFrameTimesMs.push(performance.now() - t0);
        return;
      }

      const rawTw = screenToStageTwips(ev.clientX, ev.clientY);
      dom.hudCoords.textContent = Math.round(rawTw.x / C.TWIPS_PER_PX) + ', ' + Math.round(rawTw.y / C.TWIPS_PER_PX) + ' px';

      if (state.directDrag) {
        const kf = getActiveKeyframe(false);
        if (!kf) return;
        const snapped = applySnapping(rawTw);
        if (state.directDrag.kind === 'instance') {
          const inst = kf.instances.find((i) => i.id === state.directDrag.id);
          if (inst) {
            inst.matrix.tx = state.directDrag.origTx + (snapped.x - state.directDrag.startX);
            inst.matrix.ty = state.directDrag.origTy + (snapped.y - state.directDrag.startY);
            renderStage();
          }
        } else if (state.directDrag.kind === 'vertex') {
          const v = kf.planarMap.vertices.find((vt) => vt.id === state.directDrag.id);
          if (v) { v.x = snapped.x; v.y = snapped.y; renderStage(); }
        } else if (state.directDrag.kind === 'edge') {
          const res = C.directShapeBendEdge(kf.planarMap, state.directDrag.id, snapped.x, snapped.y);
          if (res.ok) { kf.planarMap = res.map; renderStage(); }
        } else if (state.directDrag.kind === 'corner') {
          state.directDrag.curX = snapped.x;
          state.directDrag.curY = snapped.y;
          renderStage();
        }
        return;
      }

      if (state.penDraft && state.penDraft.draggingHandle) {
        const last = state.penDraft.anchors[state.penDraft.anchors.length - 1];
        last.outX = rawTw.x; last.outY = rawTw.y;
        last.inX = 2 * last.x - rawTw.x; last.inY = 2 * last.y - rawTw.y;
        renderStage();
        return;
      }

      if (state.drawingStroke) {
        // Read coalesced pointer events so fast strokes aren't jaggy (§6.1)
        const events = typeof ev.getCoalescedEvents === 'function' ? ev.getCoalescedEvents() : [ev];
        const list = events && events.length > 0 ? events : [ev];
        const stab = Math.max(0, Math.min(0.92, (state.stabiliser / 100) * 0.85));
        const pts = state.drawingStroke.pts;
        const now = performance.now();
        for (let i = 0; i < list.length; i++) {
          const ce = list[i];
          const tw = screenToStageTwips(ce.clientX, ce.clientY);
          const prev = pts[pts.length - 1];
          const sx = Math.round(prev.x * stab + tw.x * (1 - stab));
          const sy = Math.round(prev.y * stab + tw.y * (1 - stab));
          if (Math.hypot(sx - prev.x, sy - prev.y) >= 10) {
            pts.push({
              x: sx, y: sy,
              t: now,
              pressure: ce.pressure || 0.5,
              hasPenPressure: ce.pointerType === 'pen' && ce.pressure > 0
            });
          }
        }
        state.drawingStroke.lastInputTs = now;
        state.drawingStroke.previewDirty = true;
        scheduleLivePreview();
        return;
      }

      if (state.shapeDrag) {
        const tw = applySnapping(rawTw);
        state.shapeDrag.curX = tw.x;
        state.shapeDrag.curY = tw.y;
        renderStage();
        return;
      }

      // Hover highlight for direct shaping
      if (state.tool === 'select') {
        const hit = hitTestDirectShape(rawTw);
        state.hoverTarget = hit;
        dom.stageCanvas.style.cursor = hit ? (hit.kind === 'vertex' ? 'move' : 'crosshair') : 'default';
      }
    });

    function finishPointer(ev) {
      state.activePointers.delete(ev.pointerId);
      if (state.activePointers.size < 2) state.pinchStart = null;
      if (state.panDrag) { state.panDrag = null; return; }

      if (state.directDrag) {
        const kf = getActiveKeyframe(false);
        if (kf) {
          if (state.directDrag.kind === 'vertex') {
            const v = kf.planarMap.vertices.find((vt) => vt.id === state.directDrag.id);
            if (v) {
              const res = C.directShapeMoveVertex(kf.planarMap, v.id, v.x, v.y);
              if (res.ok) kf.planarMap = res.map;
            }
          } else if (state.directDrag.kind === 'corner' && state.directDrag.curX !== undefined) {
            const res = C.directShapeAddCorner(kf.planarMap, state.directDrag.id, state.directDrag.curX, state.directDrag.curY);
            if (res.ok) kf.planarMap = res.map;
          }
        }
        state.directDrag = null;
        C.commitGesture(state.undoStack, state.doc);
        markDirty();
        renderAll();
        return;
      }

      if (state.penDraft && state.penDraft.draggingHandle) {
        state.penDraft.draggingHandle = false;
        renderStage();
        return;
      }

      if (state.drawingStroke) {
        const ds = state.drawingStroke;
        state.drawingStroke = null;
        if (ds.tool === 'brush') {
          const outline = buildBrushOutlinePolygon(ds.pts, state.brushWidthPx * C.TWIPS_PER_PX);
          commitFillShape(outline, currentFillStyle(), null);
        } else if (ds.tool === 'pencil') {
          const segs = buildPencilSegments(ds.pts, state.pencilMode);
          commitStrokePath(segs, currentStrokeStyle());
        } else if (ds.tool === 'eraser') {
          const kf = getActiveKeyframe(false);
          if (kf) {
            const outline = buildBrushOutlinePolygon(ds.pts, Math.max(12, state.brushWidthPx * 1.5) * C.TWIPS_PER_PX);
            const poly = outline.map((s) => ({ x: s.x0, y: s.y0 }));
            const res = C.eraseRegion(kf.planarMap, poly, state.eraserMode, ds.pts[0]);
            if (res.ok) kf.planarMap = res.map;
            C.recomputeKeyframeBlank(kf);
          }
        }
        C.commitGesture(state.undoStack, state.doc);
        markDirty();
        renderAll();
        return;
      }

      if (state.shapeDrag) {
        const sd = state.shapeDrag;
        state.shapeDrag = null;
        const w = sd.curX - sd.startX, h = sd.curY - sd.startY;
        if (Math.hypot(w, h) >= 20) {
          if (sd.kind === 'line') {
            commitStrokePath([{ type: 'line', x0: sd.startX, y0: sd.startY, x1: sd.curX, y1: sd.curY }], currentStrokeStyle());
          } else if (sd.kind === 'rect') {
            const x = Math.min(sd.startX, sd.curX), y = Math.min(sd.startY, sd.curY);
            commitFillShape(C.makeRectPath(x, y, Math.abs(w), Math.abs(h)), currentFillStyle(), currentStrokeStyle());
          } else if (sd.kind === 'ellipse') {
            const cx = Math.round((sd.startX + sd.curX) * 0.5), cy = Math.round((sd.startY + sd.curY) * 0.5);
            commitFillShape(C.makeEllipsePath(cx, cy, Math.abs(w) * 0.5, Math.abs(h) * 0.5), currentFillStyle(), currentStrokeStyle());
          } else if (sd.kind === 'polygon') {
            const rad = Math.hypot(w, h);
            commitFillShape(C.makePolygonPath(sd.startX, sd.startY, rad, state.polygonSides), currentFillStyle(), currentStrokeStyle());
          }
          C.commitGesture(state.undoStack, state.doc);
          markDirty();
        } else {
          C.cancelGesture(state.undoStack);
        }
        renderAll();
      }
    }

    dom.stageCanvas.addEventListener('pointerup', finishPointer);
    dom.stageCanvas.addEventListener('pointercancel', finishPointer);

    // Double-click: commit pen path OR edit symbol in place
    dom.stageCanvas.addEventListener('dblclick', (ev) => {
      if (state.tool === 'pen' && state.penDraft && state.penDraft.anchors.length >= 2) {
        C.beginGesture(state.undoStack, 'pen-commit');
        const anchors = state.penDraft.anchors;
        const segs = [];
        for (let i = 0; i + 1 < anchors.length; i++) {
          const a = anchors[i], b = anchors[i + 1];
          const quads = C.cubicToQuadratics(
            { x: a.x, y: a.y }, { x: a.outX, y: a.outY },
            { x: b.inX, y: b.inY }, { x: b.x, y: b.y },
            C.CUBIC_TOLERANCE_TWIPS
          );
          for (const q of quads) segs.push(q);
        }
        state.penDraft = null;
        commitStrokePath(segs, currentStrokeStyle());
        C.commitGesture(state.undoStack, state.doc);
        markDirty();
        setStatus('Committed pen path (cubics converted to quadratics within ' + C.CUBIC_TOLERANCE_TWIPS + ' twips).');
        renderAll();
        return;
      }
      // Edit symbol in place if double-clicking an instance
      const rawTw = screenToStageTwips(ev.clientX, ev.clientY);
      const kf = getActiveKeyframe(false);
      if (kf && kf.instances.length > 0) {
        for (let i = kf.instances.length - 1; i >= 0; i--) {
          const inst = kf.instances[i];
          if (Math.hypot(rawTw.x - inst.matrix.tx, rawTw.y - inst.matrix.ty) < 800) {
            enterSymbolEdit(inst.symbolId);
            return;
          }
        }
      }
    });

    // Cursor-centered wheel zoom (4% to 2000%)
    dom.stageCanvas.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const t0 = performance.now();
      const rect = dom.stageCanvas.getBoundingClientRect();
      const mx = ev.clientX - rect.left;
      const my = ev.clientY - rect.top;
      const stageX = (mx - state.panX) / state.zoom;
      const stageY = (my - state.panY) / state.zoom;
      const factor = ev.deltaY < 0 ? 1.15 : (1 / 1.15);
      const newZoom = Math.max(0.04, Math.min(20, state.zoom * factor));
      state.zoom = newZoom;
      state.panX = mx - stageX * newZoom;
      state.panY = my - stageY * newZoom;
      dom.zoomLabel.textContent = Math.round(state.zoom * 100) + '%';
      renderStage();
      state.metrics.zoomPanFrameTimesMs.push(performance.now() - t0);
    }, { passive: false });

    // --- Live Stroke Preview RAF ---
    let livePreviewScheduled = false;
    function scheduleLivePreview() {
      if (livePreviewScheduled) return;
      livePreviewScheduled = true;
      requestAnimationFrame(() => {
        livePreviewScheduled = false;
        if (!state.drawingStroke || !state.drawingStroke.previewDirty) return;
        const inputTs = state.drawingStroke.lastInputTs;
        state.drawingStroke.previewDirty = false;
        renderStage();
        const latency = performance.now() - inputTs;
        state.metrics.inputToPixelLatenciesMs.push(latency);
      });
    }

    // --- Stage Rendering ---
    function resizeStageCanvas() {
      const rect = dom.stageWrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.floor(rect.width * dpr));
      const h = Math.max(1, Math.floor(rect.height * dpr));
      if (dom.stageCanvas.width !== w || dom.stageCanvas.height !== h) {
        dom.stageCanvas.width = w;
        dom.stageCanvas.height = h;
      }
    }

    function renderStage() {
      const t0 = performance.now();
      resizeStageCanvas();
      const ctx = dom.stageCanvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = dom.stageCanvas.width, h = dom.stageCanvas.height;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#22262e';
      ctx.fillRect(0, 0, w, h);

      ctx.scale(dpr, dpr);
      ctx.translate(state.panX, state.panY);
      ctx.scale(state.zoom / C.TWIPS_PER_PX, state.zoom / C.TWIPS_PER_PX);

      // Stage paper
      ctx.fillStyle = C.rgbaToCss(state.doc.background);
      ctx.fillRect(0, 0, state.doc.stageWidth, state.doc.stageHeight);

      // Grid
      if (state.doc.grid.visible && state.doc.grid.sizeTwips > 0) {
        ctx.strokeStyle = 'rgba(120,135,160,0.22)';
        ctx.lineWidth = Math.max(10, Math.round(20 / state.zoom));
        ctx.beginPath();
        for (let x = 0; x <= state.doc.stageWidth; x += state.doc.grid.sizeTwips) {
          ctx.moveTo(x, 0); ctx.lineTo(x, state.doc.stageHeight);
        }
        for (let y = 0; y <= state.doc.stageHeight; y += state.doc.grid.sizeTwips) {
          ctx.moveTo(0, y); ctx.lineTo(state.doc.stageWidth, y);
        }
        ctx.stroke();
      }

      // If editing symbol in place, dim main timeline behind it
      if (state.editStack.length > 0) {
        ctx.save();
        ctx.globalAlpha = 0.25;
        R.renderTimeline(ctx, state.doc, state.doc.mainTimeline, state.currentFrame, C.identityColorTransform(), { hideGuides: true });
        ctx.restore();
      }

      const tl = getActiveTimeline();

      // Onion Skin (before & after, tinted and fading with distance)
      if (state.onionEnabled && !state.playing) {
        for (let d = state.onionBefore; d >= 1; d--) {
          const f = state.currentFrame - d;
          if (f < 0) continue;
          const alpha = Math.max(0.12, 0.52 - d * 0.12);
          ctx.save();
          ctx.globalAlpha = alpha;
          R.renderTimeline(ctx, state.doc, tl, f, C.identityColorTransform(), {
            hideGuides: true,
            outlineOnly: state.onionMode === 'outline',
            tintColor: 'rgba(63,169,245,0.85)'
          });
          ctx.restore();
        }
        for (let d = 1; d <= state.onionAfter; d++) {
          const f = state.currentFrame + d;
          if (f >= tl.totalFrames) continue;
          const alpha = Math.max(0.12, 0.52 - d * 0.12);
          ctx.save();
          ctx.globalAlpha = alpha;
          R.renderTimeline(ctx, state.doc, tl, f, C.identityColorTransform(), {
            hideGuides: true,
            outlineOnly: state.onionMode === 'outline',
            tintColor: 'rgba(83,215,105,0.85)'
          });
          ctx.restore();
        }
      }

      // Main active timeline frame
      R.renderTimeline(ctx, state.doc, tl, state.currentFrame, C.identityColorTransform(), {
        hideGuides: state.playing,
        clipClockFrame: state.currentFrame
      });

      // Guides
      if (state.doc.guides.visible && !state.playing) {
        ctx.strokeStyle = 'rgba(0, 210, 255, 0.65)';
        ctx.lineWidth = Math.max(10, Math.round(20 / state.zoom));
        ctx.beginPath();
        for (const vx of state.doc.guides.vertical) { ctx.moveTo(vx, 0); ctx.lineTo(vx, state.doc.stageHeight); }
        for (const hy of state.doc.guides.horizontal) { ctx.moveTo(0, hy); ctx.lineTo(state.doc.stageWidth, hy); }
        ctx.stroke();
      }

      // Live stroke preview
      if (state.drawingStroke && state.drawingStroke.pts.length > 0) {
        const pts = state.drawingStroke.pts;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.strokeStyle = state.drawingStroke.tool === 'eraser' ? 'rgba(255,90,90,0.75)' :
          (state.drawingStroke.tool === 'brush' ? C.rgbaToCss(state.fillColor) : C.rgbaToCss(state.strokeColor));
        ctx.lineWidth = (state.drawingStroke.tool === 'pencil' ? state.strokeWidthPx : state.brushWidthPx) * C.TWIPS_PER_PX;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      // Shape drag preview
      if (state.shapeDrag) {
        const sd = state.shapeDrag;
        ctx.strokeStyle = '#4f8cff';
        ctx.lineWidth = Math.max(15, Math.round(25 / state.zoom));
        ctx.beginPath();
        if (sd.kind === 'line') {
          ctx.moveTo(sd.startX, sd.startY); ctx.lineTo(sd.curX, sd.curY);
        } else if (sd.kind === 'rect') {
          ctx.rect(sd.startX, sd.startY, sd.curX - sd.startX, sd.curY - sd.startY);
        } else if (sd.kind === 'ellipse') {
          ctx.ellipse((sd.startX + sd.curX) * 0.5, (sd.startY + sd.curY) * 0.5,
            Math.abs(sd.curX - sd.startX) * 0.5, Math.abs(sd.curY - sd.startY) * 0.5, 0, 0, Math.PI * 2);
        } else if (sd.kind === 'polygon') {
          const segs = C.makePolygonPath(sd.startX, sd.startY, Math.hypot(sd.curX - sd.startX, sd.curY - sd.startY), state.polygonSides);
          if (segs.length > 0) {
            ctx.moveTo(segs[0].x0, segs[0].y0);
            for (const s of segs) ctx.lineTo(s.x1, s.y1);
          }
        }
        ctx.stroke();
      }

      // Pen draft preview (interactive cubic preview before quadratic commit)
      if (state.penDraft && state.penDraft.anchors.length > 0) {
        const anchors = state.penDraft.anchors;
        ctx.strokeStyle = '#4f8cff';
        ctx.lineWidth = Math.max(15, Math.round(25 / state.zoom));
        ctx.beginPath();
        ctx.moveTo(anchors[0].x, anchors[0].y);
        for (let i = 0; i + 1 < anchors.length; i++) {
          const a = anchors[i], b = anchors[i + 1];
          ctx.bezierCurveTo(a.outX, a.outY, b.inX, b.inY, b.x, b.y);
        }
        ctx.stroke();
        const r = Math.max(40, Math.round(70 / state.zoom));
        for (const a of anchors) {
          ctx.fillStyle = '#fff';
          ctx.fillRect(a.x - r, a.y - r, r * 2, r * 2);
        }
      }

      // Shape hints overlay if active keyframe has shape tween hints
      const activeKf = getActiveKeyframe(false);
      if (activeKf && activeKf.tween && activeKf.tween.type === 'shape' && activeKf.tween.hints) {
        for (const h of activeKf.tween.hints) {
          ctx.fillStyle = '#e6a23c';
          ctx.beginPath();
          ctx.arc(h.x0, h.y0, Math.max(80, Math.round(140 / state.zoom)), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Stage border
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = Math.max(10, Math.round(20 / state.zoom));
      ctx.strokeRect(0, 0, state.doc.stageWidth, state.doc.stageHeight);

      state.metrics.lastRenderTimeMs = performance.now() - t0;
    }

    // --- Breadcrumb ---
    function enterSymbolEdit(symbolId) {
      const sym = state.doc.library.symbols.find((s) => s.id === symbolId);
      if (!sym) return;
      state.editStack.push({ type: 'symbol', symbolId });
      state.activeLayerId = sym.timeline.layers[0].id;
      state.currentFrame = 0;
      setStatus('Editing symbol "' + sym.name + '" in place.');
      renderAll();
    }

    function renderBreadcrumb() {
      const nodes = [
        el('button', {
          text: state.doc.mainTimeline.name,
          onClick: () => {
            state.editStack.length = 0;
            state.activeLayerId = state.doc.mainTimeline.layers[0].id;
            renderAll();
          }
        })
      ];
      for (let i = 0; i < state.editStack.length; i++) {
        const item = state.editStack[i];
        const sym = state.doc.library.symbols.find((s) => s.id === item.symbolId);
        nodes.push(el('span', { text: '›' }));
        const idx = i;
        nodes.push(el('button', {
          text: sym ? sym.name : 'Symbol',
          onClick: () => {
            state.editStack = state.editStack.slice(0, idx + 1);
            renderAll();
          }
        }));
      }
      dom.breadcrumb.replaceChildren.apply(dom.breadcrumb, nodes);
    }

    // --- Timeline Rendering & Interaction ---
    const CELL_W = 14;
    const ROW_H = 26;
    const HEADER_H = 24;

    function renderLayerList() {
      const tl = getActiveTimeline();
      const rows = tl.layers.map((lyr) => {
        const nameSpan = el('span', { class: 'tl-layer-name', text: lyr.name, title: 'Double-click to rename' });
        nameSpan.addEventListener('dblclick', (ev) => {
          ev.stopPropagation();
          const inp = el('input', { class: 'inp', value: lyr.name, style: { width: '90px', padding: '1px 3px' } });
          const commit = () => {
            C.beginGesture(state.undoStack, 'rename-layer');
            lyr.name = inp.value || lyr.name;
            C.commitGesture(state.undoStack, state.doc);
            markDirty();
            renderLayerList();
          };
          inp.addEventListener('blur', commit);
          inp.addEventListener('keydown', (ke) => { if (ke.key === 'Enter') commit(); });
          nameSpan.replaceWith(inp);
          inp.focus();
        });

        const typeTag = lyr.type === 'normal' ? '' : '[' + lyr.type[0].toUpperCase() + '] ';
        if (typeTag) nameSpan.textContent = typeTag + lyr.name;

        const visBtn = el('button', {
          class: 'tl-mini-btn' + (lyr.visible ? ' on' : ''), text: 'V', title: 'Visible',
          onClick: (ev) => { ev.stopPropagation(); lyr.visible = !lyr.visible; renderAll(); }
        });
        const lockBtn = el('button', {
          class: 'tl-mini-btn' + (lyr.locked ? ' on' : ''), text: 'L', title: 'Lock',
          onClick: (ev) => { ev.stopPropagation(); lyr.locked = !lyr.locked; renderAll(); }
        });
        const outBtn = el('button', {
          class: 'tl-mini-btn' + (lyr.outline ? ' on' : ''), text: 'O', title: 'Outline',
          onClick: (ev) => { ev.stopPropagation(); lyr.outline = !lyr.outline; renderAll(); }
        });

        return el('div', {
          class: 'tl-layer-row' + (lyr.id === state.activeLayerId ? ' active' : ''),
          onClick: () => { state.activeLayerId = lyr.id; renderAll(); }
        }, [nameSpan, visBtn, lockBtn, outBtn]);
      });
      dom.tlLayers.replaceChildren.apply(dom.tlLayers, rows);
    }

    function renderTimelineCanvas() {
      const tl = getActiveTimeline();
      const totalCols = Math.max(tl.totalFrames + 12, 60);
      const w = totalCols * CELL_W;
      const h = HEADER_H + Math.max(1, tl.layers.length) * ROW_H;
      dom.tlCanvas.width = w;
      dom.tlCanvas.height = h;
      const ctx = dom.tlCanvas.getContext('2d');

      ctx.fillStyle = '#14161a';
      ctx.fillRect(0, 0, w, h);

      // Header ruler
      ctx.fillStyle = '#1e222b';
      ctx.fillRect(0, 0, w, HEADER_H);
      ctx.fillStyle = '#8b95a8';
      ctx.font = '10px monospace';
      for (let f = 0; f < totalCols; f++) {
        const x = f * CELL_W;
        ctx.strokeStyle = '#2a2f3a';
        ctx.beginPath(); ctx.moveTo(x, HEADER_H - 6); ctx.lineTo(x, HEADER_H); ctx.stroke();
        if (f % 5 === 0) ctx.fillText(String(f + 1), x + 2, 12);
      }

      // Onion skin range bar in header
      if (state.onionEnabled) {
        const xStart = Math.max(0, state.currentFrame - state.onionBefore) * CELL_W;
        const xMid = state.currentFrame * CELL_W;
        const xEnd = Math.min(tl.totalFrames, state.currentFrame + state.onionAfter + 1) * CELL_W;
        ctx.fillStyle = 'rgba(63,169,245,0.45)';
        ctx.fillRect(xStart, 14, Math.max(0, xMid - xStart), 8);
        ctx.fillStyle = 'rgba(83,215,105,0.45)';
        ctx.fillRect(xMid + CELL_W, 14, Math.max(0, xEnd - (xMid + CELL_W)), 8);
      }

      // Layer rows
      for (let li = 0; li < tl.layers.length; li++) {
        const lyr = tl.layers[li];
        const y = HEADER_H + li * ROW_H;
        ctx.fillStyle = lyr.id === state.activeLayerId ? '#1e2430' : '#16191f';
        ctx.fillRect(0, y, w, ROW_H);
        ctx.strokeStyle = '#262b36';
        ctx.beginPath(); ctx.moveTo(0, y + ROW_H); ctx.lineTo(w, y + ROW_H); ctx.stroke();

        // Draw frame spans, tweens, waveforms, and keyframes
        for (let ki = 0; ki < lyr.keyframes.length; ki++) {
          const kf = lyr.keyframes[ki];
          const next = lyr.keyframes[ki + 1];
          const endF = next ? next.frame : tl.totalFrames;
          const x0 = kf.frame * CELL_W;
          const spanW = Math.max(CELL_W, (endF - kf.frame) * CELL_W);

          if (!kf.isBlank) {
            ctx.fillStyle = kf.tween ? (kf.tween.type === 'motion' ? 'rgba(91,138,240,0.32)' : 'rgba(78,201,139,0.32)') : 'rgba(130,145,170,0.22)';
            ctx.fillRect(x0 + 1, y + 2, spanW - 2, ROW_H - 4);
          }

          // Audio waveform inside layer (§5)
          if (kf.sound && kf.sound.soundId) {
            const snd = state.doc.library.sounds.find((s) => s.id === kf.sound.soundId);
            if (snd && snd.peaks && snd.peaks.length > 0) {
              const durFrames = Math.ceil((snd.lengthSamples / snd.sampleRate) * state.doc.fps);
              const waveW = Math.min(spanW, Math.max(CELL_W, durFrames * CELL_W));
              ctx.strokeStyle = kf.sound.sync === 'stream' ? '#4ec98b' : '#e6a23c';
              ctx.lineWidth = 1;
              ctx.beginPath();
              const midY = y + ROW_H * 0.5;
              for (let p = 0; p < snd.peaks.length; p++) {
                const px = x0 + (p / snd.peaks.length) * waveW;
                const amp = snd.peaks[p] * (ROW_H * 0.42);
                ctx.moveTo(px, midY - amp);
                ctx.lineTo(px, midY + amp);
              }
              ctx.stroke();
            }
          }

          // Keyframe dot
          ctx.beginPath();
          ctx.arc(x0 + CELL_W * 0.5, y + ROW_H * 0.5, 3.5, 0, Math.PI * 2);
          if (kf.isBlank) {
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();
          } else {
            ctx.fillStyle = '#edf1f7';
            ctx.fill();
          }
        }
      }

      // Selection span highlight
      if (state.selectionSpan) {
        const li = tl.layers.findIndex((l) => l.id === state.selectionSpan.layerId);
        if (li >= 0) {
          const sx = Math.min(state.selectionSpan.start, state.selectionSpan.end) * CELL_W;
          const sw = (Math.abs(state.selectionSpan.end - state.selectionSpan.start) + 1) * CELL_W;
          ctx.strokeStyle = '#e6a23c';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(sx + 1, HEADER_H + li * ROW_H + 1, sw - 2, ROW_H - 2);
        }
      }

      // Playhead
      const px = state.currentFrame * CELL_W + CELL_W * 0.5;
      ctx.fillStyle = '#e05a5a';
      ctx.fillRect(state.currentFrame * CELL_W, 0, CELL_W, HEADER_H);
      ctx.strokeStyle = '#e05a5a';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px, HEADER_H); ctx.lineTo(px, h); ctx.stroke();
    }

    // Timeline scrubbing, keyframe drag-to-retime, multi-select span, and onion marker dragging
    let tlDrag = null;
    dom.tlCanvas.addEventListener('pointerdown', (ev) => {
      dom.tlCanvas.setPointerCapture(ev.pointerId);
      const rect = dom.tlCanvas.getBoundingClientRect();
      const x = ev.clientX - rect.left;
      const y = ev.clientY - rect.top;
      const frame = Math.max(0, Math.floor(x / CELL_W));
      const tl = getActiveTimeline();

      if (y < HEADER_H) {
        // Check if dragging onion skin marker
        if (state.onionEnabled) {
          const beforeF = Math.max(0, state.currentFrame - state.onionBefore);
          const afterF = Math.min(tl.totalFrames - 1, state.currentFrame + state.onionAfter);
          if (Math.abs(frame - beforeF) <= 1 && frame < state.currentFrame) {
            tlDrag = { kind: 'onion-before' };
            return;
          }
          if (Math.abs(frame - afterF) <= 1 && frame > state.currentFrame) {
            tlDrag = { kind: 'onion-after' };
            return;
          }
        }
        tlDrag = { kind: 'scrub' };
        setCurrentFrame(frame, true);
        return;
      }

      const li = Math.floor((y - HEADER_H) / ROW_H);
      if (li >= 0 && li < tl.layers.length) {
        const lyr = tl.layers[li];
        state.activeLayerId = lyr.id;
        const exactKf = lyr.keyframes.find((k) => k.frame === frame);
        if (exactKf && !ev.shiftKey) {
          tlDrag = { kind: 'retime', layerId: lyr.id, fromFrame: frame };
        } else {
          tlDrag = { kind: 'span', layerId: lyr.id, startFrame: frame };
          state.selectionSpan = { layerId: lyr.id, start: frame, end: frame };
        }
        setCurrentFrame(frame, true);
        renderLayerList();
        renderSidebar();
      }
    });

    dom.tlCanvas.addEventListener('pointermove', (ev) => {
      if (!tlDrag) return;
      const rect = dom.tlCanvas.getBoundingClientRect();
      const frame = Math.max(0, Math.floor((ev.clientX - rect.left) / CELL_W));
      if (tlDrag.kind === 'scrub') {
        setCurrentFrame(frame, true);
      } else if (tlDrag.kind === 'onion-before') {
        state.onionBefore = Math.max(0, state.currentFrame - frame);
        renderStage(); renderTimelineCanvas();
      } else if (tlDrag.kind === 'onion-after') {
        state.onionAfter = Math.max(0, frame - state.currentFrame);
        renderStage(); renderTimelineCanvas();
      } else if (tlDrag.kind === 'span') {
        state.selectionSpan = { layerId: tlDrag.layerId, start: tlDrag.startFrame, end: frame };
        renderTimelineCanvas();
      }
    });

    dom.tlCanvas.addEventListener('pointerup', (ev) => {
      if (!tlDrag) return;
      if (tlDrag.kind === 'retime') {
        const rect = dom.tlCanvas.getBoundingClientRect();
        const toFrame = Math.max(0, Math.floor((ev.clientX - rect.left) / CELL_W));
        if (toFrame !== tlDrag.fromFrame) {
          C.beginGesture(state.undoStack, 'retime-keyframe');
          C.retimeKeyframe(getActiveTimeline(), tlDrag.layerId, tlDrag.fromFrame, toFrame);
          C.commitGesture(state.undoStack, state.doc);
          markDirty();
          setCurrentFrame(toFrame, false);
        }
      }
      tlDrag = null;
      renderAll();
    });

    // --- Sidebar: Properties Inspector & Library ---
    function renderSidebar() {
      if (state.sidebarTab === 'library') {
        renderLibraryPanel();
      } else {
        renderInspectorPanel();
      }
    }

    function renderInspectorPanel() {
      const sections = [];

      // 1. Tool Options
      const toolRows = [];
      if (state.tool === 'pencil') {
        toolRows.push(el('div', { class: 'row' }, [
          el('label', { text: 'Mode' }),
          el('select', {
            class: 'inp grow',
            onChange: (ev) => { state.pencilMode = ev.target.value; }
          }, ['straighten', 'smooth', 'ink'].map((m) =>
            el('option', { value: m, text: m, selected: m === state.pencilMode ? 'selected' : null })
          ))
        ]));
      }
      if (state.tool === 'brush') {
        toolRows.push(el('div', { class: 'row' }, [
          el('label', { text: 'Size' }),
          el('input', {
            type: 'range', min: '2', max: '48', value: String(state.brushWidthPx), class: 'grow',
            onInput: (ev) => { state.brushWidthPx = Number(ev.target.value); }
          })
        ]));
        toolRows.push(el('div', { class: 'row' }, [
          el('label', { text: 'Stabiliser' }),
          el('input', {
            type: 'range', min: '0', max: '100', value: String(state.stabiliser), class: 'grow',
            onInput: (ev) => { state.stabiliser = Number(ev.target.value); }
          })
        ]));
      }
      if (state.tool === 'bucket') {
        toolRows.push(el('div', { class: 'row' }, [
          el('label', { text: 'Gap Close' }),
          el('select', {
            class: 'inp grow',
            onChange: (ev) => { state.bucketGap = ev.target.value; }
          }, ['none', 'small', 'medium', 'large'].map((g) =>
            el('option', { value: g, text: g, selected: g === state.bucketGap ? 'selected' : null })
          ))
        ]));
      }
      if (state.tool === 'eraser') {
        toolRows.push(el('div', { class: 'row' }, [
          el('label', { text: 'Erase' }),
          el('select', {
            class: 'inp grow',
            onChange: (ev) => { state.eraserMode = ev.target.value; }
          }, ['normal', 'fills-only', 'lines-only', 'inside'].map((m) =>
            el('option', { value: m, text: m, selected: m === state.eraserMode ? 'selected' : null })
          ))
        ]));
      }
      if (state.tool === 'polygon') {
        toolRows.push(el('div', { class: 'row' }, [
          el('label', { text: 'Sides' }),
          el('input', {
            class: 'inp', type: 'number', min: '3', max: '16', value: String(state.polygonSides),
            onChange: (ev) => { state.polygonSides = Math.max(3, Math.min(16, parseInt(ev.target.value, 10) || 5)); }
          })
        ]));
      }
      sections.push(el('div', { class: 'section' }, [
        el('div', { class: 'section-title', text: 'Tool & Paint' }),
        ...toolRows,
        el('div', { class: 'row' }, [
          el('label', { text: 'Fill Type' }),
          el('select', {
            class: 'inp grow',
            onChange: (ev) => { state.fillType = ev.target.value; renderInspectorPanel(); }
          }, ['solid', 'linear', 'radial', 'bitmap'].map((ft) =>
            el('option', { value: ft, text: ft, selected: ft === state.fillType ? 'selected' : null })
          ))
        ]),
        el('div', { class: 'row' }, [
          el('label', { text: 'Fill' }),
          el('input', {
            type: 'color', class: 'swatch', value: C.rgbaToHex(state.fillColor),
            onInput: (ev) => { state.fillColor = C.hexToRgba(ev.target.value, state.fillColor.a); }
          }),
          el('label', { text: 'Stroke', style: { minWidth: '40px' } }),
          el('input', {
            type: 'color', class: 'swatch', value: C.rgbaToHex(state.strokeColor),
            onInput: (ev) => { state.strokeColor = C.hexToRgba(ev.target.value, 255); }
          }),
          el('input', {
            class: 'inp', type: 'number', min: '1', max: '40', value: String(state.strokeWidthPx),
            style: { width: '48px' }, title: 'Stroke width px',
            onChange: (ev) => { state.strokeWidthPx = Math.max(1, parseInt(ev.target.value, 10) || 2); }
          })
        ])
      ]));

      // 2. Tween & Custom Ease Editor
      const kf = getActiveKeyframe(false);
      const tweenType = (kf && kf.tween) ? kf.tween.type : 'none';
      const easeVal = (kf && kf.tween) ? (kf.tween.ease || 0) : 0;
      const rotMode = (kf && kf.tween) ? (kf.tween.rotateMode || 'auto') : 'auto';
      const easeCanvas = el('canvas', { id: 'ease-canvas', width: '236', height: '76' });

      const tweenSection = el('div', { class: 'section' }, [
        el('div', { class: 'section-title', text: 'Keyframe Tween' }),
        el('div', { class: 'row' }, [
          el('label', { text: 'Type' }),
          el('select', {
            class: 'inp grow',
            onChange: (ev) => {
              const targetKf = getActiveKeyframe(true);
              C.beginGesture(state.undoStack, 'set-tween');
              if (ev.target.value === 'none') targetKf.tween = null;
              else targetKf.tween = {
                type: ev.target.value, ease: 0, customEase: null,
                rotateMode: 'auto', rotateTimes: 0, orientToPath: false, hints: []
              };
              C.commitGesture(state.undoStack, state.doc);
              markDirty();
              renderAll();
            }
          }, ['none', 'motion', 'shape'].map((tt) =>
            el('option', { value: tt, text: tt, selected: tt === tweenType ? 'selected' : null })
          ))
        ])
      ]);

      if (kf && kf.tween) {
        tweenSection.appendChild(el('div', { class: 'row' }, [
          el('label', { text: 'Ease (' + easeVal + ')' }),
          el('input', {
            type: 'range', min: '-100', max: '100', value: String(easeVal), class: 'grow',
            onInput: (ev) => {
              kf.tween.ease = Number(ev.target.value);
              kf.tween.customEase = null;
              drawEaseCurve(easeCanvas, kf.tween);
              renderStage();
            },
            onChange: () => { C.recordAction(state.undoStack, state.doc, 'ease'); markDirty(); }
          })
        ]));
        tweenSection.appendChild(easeCanvas);
        drawEaseCurve(easeCanvas, kf.tween);

        if (kf.tween.type === 'motion') {
          tweenSection.appendChild(el('div', { class: 'row' }, [
            el('label', { text: 'Rotate' }),
            el('select', {
              class: 'inp grow',
              onChange: (ev) => {
                kf.tween.rotateMode = ev.target.value;
                C.recordAction(state.undoStack, state.doc, 'rot-mode');
                markDirty(); renderStage();
              }
            }, ['auto', 'none', 'cw', 'ccw'].map((rm) =>
              el('option', { value: rm, text: rm, selected: rm === rotMode ? 'selected' : null })
            )),
            el('input', {
              class: 'inp', type: 'number', min: '0', max: '20', value: String(kf.tween.rotateTimes || 0),
              style: { width: '44px' }, title: 'Extra turns',
              onChange: (ev) => {
                kf.tween.rotateTimes = Math.max(0, parseInt(ev.target.value, 10) || 0);
                C.recordAction(state.undoStack, state.doc, 'rot-turns');
                markDirty(); renderStage();
              }
            })
          ]));
          tweenSection.appendChild(el('div', { class: 'row' }, [
            el('button', {
              class: 'btn' + (kf.tween.orientToPath ? ' active' : ''),
              text: kf.tween.orientToPath ? 'Orient to Path: ON' : 'Orient to Path: OFF',
              onClick: () => {
                kf.tween.orientToPath = !kf.tween.orientToPath;
                C.recordAction(state.undoStack, state.doc, 'orient');
                markDirty(); renderAll();
              }
            })
          ]));
        } else if (kf.tween.type === 'shape') {
          tweenSection.appendChild(el('div', { class: 'row' }, [
            el('button', {
              class: 'btn', text: '+ Add Shape Hint',
              onClick: () => {
                const label = String.fromCharCode(97 + (kf.tween.hints.length % 26));
                kf.tween.hints.push({ label, x0: 2000, y0: 2000, x1: 2000, y1: 2000 });
                C.recordAction(state.undoStack, state.doc, 'add-hint');
                markDirty(); renderAll();
              }
            }),
            el('span', { text: (kf.tween.hints ? kf.tween.hints.length : 0) + ' hints' })
          ]));
        }
      }
      sections.push(tweenSection);

      // 3. Layer Parent (Mask / Guide) & Audio Placement
      const lyr = getActiveLayer();
      const tl = getActiveTimeline();
      if (lyr) {
        const parents = tl.layers.filter((p) => p.id !== lyr.id && (p.type === 'mask' || p.type === 'guide' || p.type === 'folder'));
        const layerSec = el('div', { class: 'section' }, [
          el('div', { class: 'section-title', text: 'Layer & Audio' }),
          el('div', { class: 'row' }, [
            el('label', { text: 'Parent' }),
            el('select', {
              class: 'inp grow',
              onChange: (ev) => {
                lyr.parentId = ev.target.value || null;
                C.recordAction(state.undoStack, state.doc, 'layer-parent');
                markDirty(); renderAll();
              }
            }, [el('option', { value: '', text: '(none)' })].concat(parents.map((p) =>
              el('option', { value: p.id, text: '[' + p.type + '] ' + p.name, selected: p.id === lyr.parentId ? 'selected' : null })
            )))
          ])
        ]);
        if (kf) {
          const curSndId = kf.sound ? kf.sound.soundId : '';
          layerSec.appendChild(el('div', { class: 'row' }, [
            el('label', { text: 'Sound' }),
            el('select', {
              class: 'inp grow',
              onChange: (ev) => {
                if (!ev.target.value) kf.sound = null;
                else kf.sound = { soundId: ev.target.value, sync: 'stream', envelope: [{ t: 0, left: 1, right: 1 }, { t: 10, left: 1, right: 1 }] };
                C.recordAction(state.undoStack, state.doc, 'set-sound');
                markDirty(); renderAll();
              }
            }, [el('option', { value: '', text: '(none)' })].concat(state.doc.library.sounds.map((s) =>
              el('option', { value: s.id, text: s.name, selected: s.id === curSndId ? 'selected' : null })
            )))
          ]));
          if (kf.sound) {
            layerSec.appendChild(el('div', { class: 'row' }, [
              el('label', { text: 'Sync' }),
              el('select', {
                class: 'inp grow',
                onChange: (ev) => {
                  kf.sound.sync = ev.target.value;
                  C.recordAction(state.undoStack, state.doc, 'sound-sync');
                  markDirty(); renderAll();
                }
              }, ['stream', 'event'].map((m) =>
                el('option', { value: m, text: m, selected: m === kf.sound.sync ? 'selected' : null })
              ))
            ]));
          }
        }
        sections.push(layerSec);
      }

      // 4. Grid & Stage
      sections.push(el('div', { class: 'section' }, [
        el('div', { class: 'section-title', text: 'Stage & Grid' }),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'btn' + (state.doc.grid.visible ? ' active' : ''), text: 'Show Grid',
            onClick: () => { state.doc.grid.visible = !state.doc.grid.visible; renderAll(); }
          }),
          el('button', {
            class: 'btn' + (state.doc.grid.snap ? ' active' : ''), text: 'Snap Grid',
            onClick: () => { state.doc.grid.snap = !state.doc.grid.snap; renderAll(); }
          })
        ])
      ]));

      dom.sidebarBody.replaceChildren.apply(dom.sidebarBody, sections);
    }

    function drawEaseCurve(canvas, tween) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#333b4a';
      ctx.beginPath(); ctx.moveTo(8, h - 8); ctx.lineTo(w - 8, 8); ctx.stroke();
      ctx.strokeStyle = '#4f8cff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 40; i++) {
        const t = i / 40;
        const y = C.evaluateTweenEase(t, tween);
        const px = 8 + t * (w - 16);
        const py = (h - 8) - y * (h - 16);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    function renderLibraryPanel() {
      const counts = C.computeUsageCounts(state.doc);
      const actions = el('div', { class: 'section' }, [
        el('div', { class: 'section-title', text: 'Library Actions' }),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'btn', text: '+ Graphic',
            onClick: () => {
              C.beginGesture(state.undoStack, 'new-sym');
              C.createSymbol(state.doc, 'Graphic ' + (state.doc.library.symbols.length + 1), 'graphic');
              C.commitGesture(state.undoStack, state.doc);
              markDirty(); renderSidebar();
            }
          }),
          el('button', {
            class: 'btn', text: '+ Clip',
            onClick: () => {
              C.beginGesture(state.undoStack, 'new-sym');
              C.createSymbol(state.doc, 'Clip ' + (state.doc.library.symbols.length + 1), 'clip');
              C.commitGesture(state.undoStack, state.doc);
              markDirty(); renderSidebar();
            }
          }),
          el('button', {
            class: 'btn', text: '+ Button',
            onClick: () => {
              C.beginGesture(state.undoStack, 'new-sym');
              C.createSymbol(state.doc, 'Button ' + (state.doc.library.symbols.length + 1), 'button');
              C.commitGesture(state.undoStack, state.doc);
              markDirty(); renderSidebar();
            }
          })
        ]),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'btn', text: '+ Folder',
            onClick: () => {
              C.beginGesture(state.undoStack, 'new-folder');
              C.addLibraryFolder(state.doc, 'Folder ' + (state.doc.library.folders.length + 1));
              C.commitGesture(state.undoStack, state.doc);
              markDirty(); renderSidebar();
            }
          }),
          el('button', {
            class: 'btn', text: 'Select Unused',
            onClick: () => {
              const unused = C.selectUnusedLibraryItems(state.doc);
              setStatus('Unused library items: ' + unused.length + (unused.length ? ' (' + unused.map((u) => u.name).join(', ') + ')' : ''));
            }
          }),
          el('button', {
            class: 'btn danger', text: 'Del Unused',
            onClick: () => {
              C.beginGesture(state.undoStack, 'del-unused');
              const removed = C.deleteUnusedLibraryItems(state.doc);
              C.commitGesture(state.undoStack, state.doc);
              markDirty();
              setStatus('Deleted ' + removed.length + ' unused item(s).');
              renderSidebar();
            }
          })
        ])
      ]);

      const itemsList = el('div', { class: 'section' }, [
        el('div', { class: 'section-title', text: 'Items (double-click symbol to edit)' })
      ]);

      for (const sym of state.doc.library.symbols) {
        itemsList.appendChild(el('div', {
          class: 'lib-item',
          draggable: 'true',
          onDragstart: (ev) => { ev.dataTransfer.setData('text/plain', 'symbol:' + sym.id); },
          onDblclick: () => enterSymbolEdit(sym.id)
        }, [
          el('span', { class: 'lib-badge', text: sym.kind.slice(0, 3).toUpperCase() }),
          el('span', { class: 'grow', text: sym.name }),
          el('span', { class: 'lib-badge', text: 'use:' + (counts[sym.id] || 0) }),
          el('button', {
            class: 'btn', text: '+Stage',
            onClick: (ev) => {
              ev.stopPropagation();
              const kf = getActiveKeyframe(true);
              C.beginGesture(state.undoStack, 'place-instance');
              const m = C.identityMatrix();
              m.tx = Math.round(state.doc.stageWidth * 0.5);
              m.ty = Math.round(state.doc.stageHeight * 0.5);
              kf.instances.push(C.createSymbolInstance(state.doc, sym.id, m));
              C.recomputeKeyframeBlank(kf);
              C.commitGesture(state.undoStack, state.doc);
              markDirty(); renderAll();
            }
          })
        ]));
      }

      for (const bmp of state.doc.library.bitmaps) {
        itemsList.appendChild(el('div', { class: 'lib-item' }, [
          el('span', { class: 'lib-badge', text: 'BMP' }),
          el('span', { class: 'grow', text: bmp.name }),
          el('span', { class: 'lib-badge', text: 'use:' + (counts[bmp.id] || 0) })
        ]));
      }

      for (const snd of state.doc.library.sounds) {
        itemsList.appendChild(el('div', { class: 'lib-item' }, [
          el('span', { class: 'lib-badge', text: 'SND' }),
          el('span', { class: 'grow', text: snd.name }),
          el('span', { class: 'lib-badge', text: 'use:' + (counts[snd.id] || 0) })
        ]));
      }

      dom.sidebarBody.replaceChildren(actions, itemsList);
    }

    // Drag library symbol onto stage
    dom.stageWrap.addEventListener('dragover', (ev) => { ev.preventDefault(); });
    dom.stageWrap.addEventListener('drop', (ev) => {
      ev.preventDefault();
      const data = ev.dataTransfer.getData('text/plain');
      if (data && data.startsWith('symbol:')) {
        const symId = data.slice(7);
        const tw = screenToStageTwips(ev.clientX, ev.clientY);
        const kf = getActiveKeyframe(true);
        C.beginGesture(state.undoStack, 'drop-instance');
        const m = C.identityMatrix();
        m.tx = tw.x; m.ty = tw.y;
        kf.instances.push(C.createSymbolInstance(state.doc, symId, m));
        C.recomputeKeyframeBlank(kf);
        C.commitGesture(state.undoStack, state.doc);
        markDirty(); renderAll();
      }
    });

    // --- File Import / Export ---
    function downloadSnapshot() {
      const json = C.serializeDocument(state.doc);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: 'speedster-snapshot.json' });
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus('Exported JSON snapshot (' + json.length + ' bytes).');
    }

    fileInputJson.addEventListener('change', async (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        state.doc = C.deserializeDocument(text);
        state.undoStack = C.createUndoStack(state.doc);
        state.editStack.length = 0;
        state.activeLayerId = state.doc.mainTimeline.layers[0].id;
        state.currentFrame = 0;
        markDirty();
        setStatus('Loaded snapshot "' + file.name + '".');
        renderAll();
      } catch (err) {
        setStatus('Load failed: ' + err.message, true);
      }
      fileInputJson.value = '';
    });

    fileInputImg.addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          C.beginGesture(state.undoStack, 'import-bitmap');
          const bmp = C.addLibraryBitmap(state.doc, file.name, img.naturalWidth, img.naturalHeight, reader.result);
          state.selectedBitmapId = bmp.id;
          C.commitGesture(state.undoStack, state.doc);
          markDirty();
          setStatus('Imported bitmap "' + file.name + '".');
          renderSidebar();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      fileInputImg.value = '';
    });

    fileInputAudio.addEventListener('change', async (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      try {
        const arrBuf = await file.arrayBuffer();
        const bytes = new Uint8Array(arrBuf);
        const b64 = C.bytesToBase64(bytes);
        let sampleRate = 44100, channels = 1, lengthSamples = 0, peaks = [];
        if (file.name.toLowerCase().endsWith('.wav')) {
          const wav = C.decodeWavPcm16(bytes);
          sampleRate = wav.sampleRate;
          channels = wav.channels;
          lengthSamples = wav.samples.length;
          peaks = C.computeWaveformPeaks(wav.samples, 128);
        } else {
          const AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
          if (AC) {
            const ctx = new AC();
            const buf = await ctx.decodeAudioData(arrBuf.slice(0));
            sampleRate = buf.sampleRate;
            channels = buf.numberOfChannels;
            lengthSamples = buf.length;
            peaks = C.computeWaveformPeaks(buf.getChannelData(0), 128);
            ctx.close();
          }
        }
        C.beginGesture(state.undoStack, 'import-sound');
        C.addLibrarySound(state.doc, {
          name: file.name, sampleRate, channels, lengthSamples,
          format: file.name.split('.').pop().toLowerCase(),
          pcmBase64: b64, peaks
        });
        C.commitGesture(state.undoStack, state.doc);
        markDirty();
        setStatus('Imported audio "' + file.name + '".');
        renderSidebar();
      } catch (err) {
        setStatus('Audio import failed: ' + err.message, true);
      }
      fileInputAudio.value = '';
    });

    // --- Keybindings Modal & Keyboard Listener ---
    function openKeybindingsModal() {
      const list = el('div', { class: 'modal-body' });
      const backdrop = el('div', { class: 'modal-backdrop' });
      for (const action of Object.keys(state.keybindings)) {
        const btn = el('button', {
          class: 'btn', text: state.keybindings[action],
          onClick: () => {
            btn.textContent = 'Press key...';
            const onKey = (ke) => {
              ke.preventDefault();
              state.keybindings[action] = ke.key;
              btn.textContent = ke.key;
              S.saveToIndexedDB(S.KEYS_KEY, state.keybindings);
              window.removeEventListener('keydown', onKey, true);
            };
            window.addEventListener('keydown', onKey, true);
          }
        });
        list.appendChild(el('div', { class: 'key-row' }, [el('span', { text: action }), btn]));
      }
      const card = el('div', { class: 'modal-card' }, [
        el('div', { class: 'row' }, [
          el('strong', { text: 'Rebindable Keybindings', class: 'grow' }),
          el('button', { class: 'btn', text: 'Close', onClick: () => backdrop.remove() })
        ]),
        list
      ]);
      backdrop.appendChild(card);
      document.body.appendChild(backdrop);
    }

    window.addEventListener('keydown', (ev) => {
      if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT')) return;
      if (ev.code === 'Space') { state.spaceDown = true; ev.preventDefault(); return; }
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') {
        ev.preventDefault();
        if (ev.shiftKey) performRedo(); else performUndo();
        return;
      }
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') {
        ev.preventDefault(); performRedo(); return;
      }
      const k = ev.key;
      const kb = state.keybindings;
      for (const action of Object.keys(kb)) {
        if (kb[action].toLowerCase() === k.toLowerCase()) {
          ev.preventDefault();
          if (action.startsWith('tool_')) selectTool(action.slice(5));
          else if (action === 'step_back') stepFrame(-1);
          else if (action === 'step_forward') stepFrame(1);
          else if (action === 'play_toggle') togglePlayback();
          else if (action === 'fit_window') fitStageToWindow();
          else if (action === 'insert_keyframe') insertKeyframeAction(false);
          else if (action === 'insert_blank_keyframe') insertKeyframeAction(true);
          else if (action === 'insert_frame') insertFrameAction();
          return;
        }
      }
    });

    window.addEventListener('keyup', (ev) => {
      if (ev.code === 'Space') state.spaceDown = false;
    });

    // --- Main Animation Loop (Fixed-Timestep Accumulator Playback) ---
    function mainLoop(ts) {
      if (state.playing) {
        const dt = Math.min(250, Math.max(0, ts - state.lastRafTs));
        state.lastRafTs = ts;
        state.metrics.playbackElapsedMs += dt;
        const prevF = state.clock.frame;
        const res = C.tickPlaybackClock(state.clock, dt);
        if (res.advanced > 0) {
          state.currentFrame = res.frame;
          state.metrics.playbackFramesRendered += 1;
          dom.frameReadout.textContent = 'F ' + (res.frame + 1) + ' / ' + state.clock.totalFrames;
          renderStage();
          renderTimelineCanvas();
          if (res.frame !== prevF) {
            audioEngine.onPlaybackFrame(state.doc, res.frame, false);
          }
        }
      }
      requestAnimationFrame(mainLoop);
    }

    // --- Autosave Timer & Blur/Visibility Handlers (IndexedDB, wrapped in try/catch) ---
    async function triggerAutosave() {
      if (!state.dirty) return true;
      dom.autosavePill.textContent = 'Autosave: Saving...';
      const ok = await S.saveDocumentAutosave(state.doc);
      if (ok) {
        state.dirty = false;
        dom.autosavePill.textContent = 'Autosave: Saved';
      } else {
        dom.autosavePill.textContent = 'Autosave: Unavailable';
      }
      return ok;
    }

    setInterval(() => { triggerAutosave(); }, 5000);
    window.addEventListener('blur', () => { triggerAutosave(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') triggerAutosave();
    });

    function renderAll() {
      renderBreadcrumb();
      renderLayerList();
      renderTimelineCanvas();
      renderSidebar();
      renderStage();
    }

    window.addEventListener('resize', () => renderStage());

    // Restore autosaved doc & keybindings on startup
    (async function boot() {
      try {
        const savedKeys = await S.loadFromIndexedDB(S.KEYS_KEY);
        if (savedKeys && typeof savedKeys === 'object') {
          Object.assign(state.keybindings, savedKeys);
        }
        const savedDoc = await S.loadDocumentAutosave();
        if (savedDoc) {
          state.doc = savedDoc;
          state.undoStack = C.createUndoStack(state.doc);
          state.activeLayerId = state.doc.mainTimeline.layers[0].id;
          state.clock.fps = state.doc.fps;
          state.clock.totalFrames = state.doc.mainTimeline.totalFrames;
          dom.fpsInput.value = String(state.doc.fps);
          dom.autosavePill.textContent = 'Autosave: Restored';
          setStatus('Restored autosaved document from IndexedDB.');
        }
      } catch (_) {}
      fitStageToWindow();
      renderAll();
      requestAnimationFrame(mainLoop);
    })();

    // Clean programmatic API for testing & benchmarking
    return {
      getState: () => state,
      getDoc: () => state.doc,
      getDocHash: () => C.hashDocument(state.doc),
      loadDoc: (doc) => {
        state.doc = doc;
        state.undoStack = C.createUndoStack(doc);
        state.editStack.length = 0;
        state.activeLayerId = doc.mainTimeline.layers[0].id;
        state.currentFrame = 0;
        state.clock = C.createPlaybackClock(doc.fps, doc.mainTimeline.totalFrames, true);
        dom.fpsInput.value = String(doc.fps);
        markDirty();
        fitStageToWindow();
        renderAll();
      },
      forceAutosaveNow: async () => { state.dirty = true; return await triggerAutosave(); },
      setCurrentFrame,
      togglePlayback,
      selectTool,
      renderStage,
      renderFrameToRgba: (frame) => {
        const off = document.createElement('canvas');
        const imgData = R.renderFrameToCanvas(off, state.doc, frame);
        return { width: imgData.width, height: imgData.height, data: Array.from(imgData.data) };
      },
      renderAudioOffline: (sr) => audioEngine.renderTimelineOfflineBrowser(state.doc, sr),
      getMetrics: () => state.metrics,
      resetMetrics: () => {
        state.metrics.inputToPixelLatenciesMs.length = 0;
        state.metrics.scrubFrameTimesMs.length = 0;
        state.metrics.zoomPanFrameTimesMs.length = 0;
        state.metrics.playbackFramesRendered = 0;
        state.metrics.playbackElapsedMs = 0;
      }
    };
  }

  window.addEventListener('DOMContentLoaded', () => {
    root.SpeedsterApp = initSpeedsterStudio();
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
